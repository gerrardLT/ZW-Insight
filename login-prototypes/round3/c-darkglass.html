<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>方向C · 深色玻璃 Dark Glass</title>
<style>
  :root { --orange:#ff6b00; --sans:"Source Han Sans SC","PingFang SC","Microsoft YaHei",sans-serif; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { height:100%; }
  body { font-family:var(--sans); overflow:hidden; position:relative; color:#eef0f2; }
  .bg { position:absolute; inset:0; background:url("../../zw-insight-web/src/assets/login-bg-poster.jpg") center/cover no-repeat #0b0e12; }
  .scrim { position:absolute; inset:0; background:radial-gradient(120% 100% at 70% 50%, rgba(8,10,13,.28) 0%, rgba(8,10,13,.62) 100%); }
  .wrap { position:relative; height:100%; display:flex; align-items:center; justify-content:space-between; padding:0 8vw; }
  /* 左：大字 + 橙色重点词 */
  .left { max-width:36rem; }
  .logo { display:flex; align-items:center; gap:.7rem; margin-bottom:2.4rem; font-size:18px; font-weight:600; letter-spacing:.06em; }
  .logo i { width:34px; height:34px; border-radius:9px; background:var(--orange); display:inline-flex; align-items:center; justify-content:center; color:#fff; font-weight:700; }
  h1 { font-size:clamp(38px,4.2vw,60px); font-weight:700; line-height:1.18; letter-spacing:.01em; }
  h1 span { color:var(--orange); }
  .sub { margin-top:1.4rem; font-size:16px; line-height:1.9; color:rgba(238,240,242,.72); max-width:30rem; }
  .chips { margin-top:2rem; display:flex; gap:.7rem; flex-wrap:wrap; }
  .chips span { font-size:13px; padding:.45rem .9rem; border:1px solid rgba(238,240,242,.22); border-radius:999px; color:rgba(238,240,242,.8); backdrop-filter:blur(6px); }
  /* 右：磨砂玻璃卡 */
  .glass { width:400px; padding:40px 36px; border-radius:20px; background:rgba(16,20,25,.55); backdrop-filter:blur(20px) saturate(1.3); border:1px solid rgba(255,255,255,.12); box-shadow:0 30px 80px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.08); }
  .glass h2 { font-size:24px; font-weight:600; margin-bottom:.4rem; }
  .glass .s { font-size:13px; color:rgba(238,240,242,.6); margin-bottom:1.8rem; }
  .tabs { display:flex; gap:1.6rem; margin-bottom:1.6rem; border-bottom:1px solid rgba(255,255,255,.12); }
  .tabs button { background:none; border:0; color:rgba(238,240,242,.55); font-size:14px; padding:0 0 .7rem; cursor:pointer; position:relative; }
  .tabs button.on { color:#fff; }
  .tabs button.on::after { content:''; position:absolute; left:0; right:0; bottom:-1px; height:2px; background:var(--orange); border-radius:2px; }
  .inp { margin-bottom:1.1rem; }
  .inp input { width:100%; background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.14); border-radius:12px; padding:.85rem 1rem; color:#fff; font-size:15px; outline:none; transition:border-color .2s, background .2s; }
  .inp input::placeholder { color:rgba(238,240,242,.4); }
  .inp input:focus { border-color:var(--orange); background:rgba(255,107,0,.08); }
  .btn { width:100%; border:0; border-radius:12px; background:var(--orange); color:#fff; padding:.95rem 0; font-size:15px; font-weight:600; letter-spacing:.12em; cursor:pointer; box-shadow:0 10px 26px rgba(255,107,0,.35); transition:transform .2s, box-shadow .2s; }
  .btn:hover { transform:translateY(-1px); box-shadow:0 14px 32px rgba(255,107,0,.45); }
  .foot { margin-top:1.2rem; display:flex; justify-content:space-between; font-size:12px; color:rgba(238,240,242,.55); }
  .foot a { color:var(--orange); text-decoration:none; }
</style>
</head>
<body>
  <div class="bg"></div><div class="scrim"></div>
  <div class="wrap">
    <div class="left">
      <div class="logo"><i>ZW</i>中维智营</div>
      <h1>让工程管理，<br /><span>清晰</span> 如一块玻璃。</h1>
      <p class="sub">项目、合同、预算、财务、材料、机械、劳务、分包，全生命周期数据实时汇聚，一屏看清。</p>
      <div class="chips"><span>全链路数字化</span><span>多组织协同</span><span>实时看板</span></div>
    </div>
    <form class="glass" onsubmit="return false">
      <h2>欢迎回来</h2>
      <p class="s">登录账户，继续您的工程项目管理</p>
      <div class="tabs"><button class="on" type="button">密码登录</button><button type="button">短信登录</button></div>
      <div class="inp"><input placeholder="用户名" /></div>
      <div class="inp"><input type="password" placeholder="密码" /></div>
      <button class="btn" type="button">进入系统</button>
      <div class="foot"><span>滑块验证已就绪</span><a href="#">忘记密码？</a></div>
    </form>
  </div>
</body>
</html>
