<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>方向A · 编辑排版 Editorial</title>
<style>
  :root { --orange:#ff6b00; --ink:#14171a; --paper:#ffffff; --mute:#6b7280; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { height:100%; }
  body {
    font-family: "Source Han Serif SC","Noto Serif SC",Georgia,"Songti SC",serif;
    color:var(--ink); overflow:hidden; position:relative;
  }
  .bg { position:absolute; inset:0; background:url("../../zw-insight-web/src/assets/login-bg-poster.jpg") center/cover no-repeat #0e1116; }
  .scrim { position:absolute; inset:0; background:linear-gradient(90deg, rgba(10,12,14,.62) 0%, rgba(10,12,14,.18) 45%, rgba(10,12,14,.42) 100%); }
  .wrap { position:relative; height:100%; display:flex; align-items:center; justify-content:space-between; padding:0 7vw; }
  /* 左：编辑式大标题 */
  .left { max-width:34rem; color:#f4f5f3; }
  .kicker { font-family:Consolas,Menlo,monospace; font-size:12px; letter-spacing:.34em; text-transform:uppercase; color:var(--orange); margin-bottom:1.4rem; }
  h1 { font-size:clamp(40px,4.6vw,64px); line-height:1.12; font-weight:600; letter-spacing:.01em; }
  h1 em { font-style:normal; color:var(--orange); }
  .rule { width:56px; height:2px; background:var(--orange); margin:1.6rem 0; }
  .lede { font-size:16px; line-height:1.9; color:rgba(244,245,243,.78); max-width:30rem; }
  .meta { margin-top:2.2rem; display:flex; gap:2.4rem; font-family:Consolas,Menlo,monospace; font-size:12px; letter-spacing:.12em; color:rgba(244,245,243,.6); }
  .meta b { display:block; color:var(--orange); font-weight:400; margin-bottom:.3rem; }
  /* 右：极简白卡，发丝线分隔 */
  .card { width:380px; background:var(--paper); padding:44px 40px; box-shadow:0 30px 80px rgba(0,0,0,.45); border-top:3px solid var(--orange); }
  .card h2 { font-size:26px; font-weight:600; margin-bottom:.4rem; }
  .card .sub { font-size:13px; color:var(--mute); margin-bottom:2rem; font-family:"Source Han Sans SC","PingFang SC",sans-serif; }
  .field { margin-bottom:1.4rem; font-family:"Source Han Sans SC","PingFang SC",sans-serif; }
  .field label { display:block; font-size:12px; letter-spacing:.14em; color:var(--mute); margin-bottom:.45rem; }
  .field input { width:100%; border:0; border-bottom:1px solid #d8dbde; padding:10px 2px; font-size:15px; background:transparent; outline:none; transition:border-color .2s; }
  .field input:focus { border-bottom-color:var(--orange); }
  .btn { width:100%; margin-top:.6rem; border:0; background:var(--orange); color:#fff; font-size:15px; letter-spacing:.28em; padding:14px 0; cursor:pointer; font-family:"Source Han Sans SC","PingFang SC",sans-serif; transition:filter .2s; }
  .btn:hover { filter:brightness(1.06); }
  .foot { margin-top:1.4rem; display:flex; justify-content:space-between; font-size:12px; font-family:"Source Han Sans SC","PingFang SC",sans-serif; color:var(--mute); }
  .foot a { color:var(--orange); text-decoration:none; }
</style>
</head>
<body>
  <div class="bg"></div><div class="scrim"></div>
  <div class="wrap">
    <div class="left">
      <div class="kicker">Zhongwei Insight · Est. 2026</div>
      <h1>把每一个工程，<br />管成<em>一门精确的手艺</em>。</h1>
      <div class="rule"></div>
      <p class="lede">项目、合同、预算、财务、材料、机械、劳务、分包——全生命周期在一处协同，让决策有依据、让成本可追溯。</p>
      <div class="meta">
        <span><b>01</b>全链路数字化</span>
        <span><b>02</b>多组织协同</span>
        <span><b>03</b>实时看板</span>
      </div>
    </div>
    <form class="card" onsubmit="return false">
      <h2>欢迎回来</h2>
      <p class="sub">登录账户，继续您的工程项目管理</p>
      <div class="field"><label>USERNAME</label><input placeholder="用户名" /></div>
      <div class="field"><label>PASSWORD</label><input type="password" placeholder="密码" /></div>
      <button class="btn">进入系统</button>
      <div class="foot"><span>短信登录</span><a href="#">忘记密码？</a></div>
    </form>
  </div>
</body>
</html>
