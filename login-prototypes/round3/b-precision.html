<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>方向B · 精密仪器 Precision</title>
<style>
  :root { --orange:#ff6b00; --ink:#16191c; --line:#e3e6e8; --mute:#79808a; --mono:Consolas,"SFMono-Regular",Menlo,monospace; --sans:"Source Han Sans SC","PingFang SC","Microsoft YaHei",sans-serif; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { height:100%; }
  body { font-family:var(--sans); color:var(--ink); overflow:hidden; position:relative; }
  .bg { position:absolute; inset:0; background:url("../../zw-insight-web/src/assets/login-bg-poster.jpg") center/cover no-repeat #0e1116; }
  .scrim { position:absolute; inset:0; background:linear-gradient(90deg, rgba(10,12,14,.66) 0%, rgba(10,12,14,.2) 48%, rgba(10,12,14,.5) 100%); }
  .wrap { position:relative; height:100%; display:grid; grid-template-columns:1fr 460px; align-items:center; padding:0 6vw; gap:4vw; }
  /* 左：规格表式品牌区 */
  .left { color:#eef0ee; }
  .tag { display:inline-flex; align-items:center; gap:.5rem; font-family:var(--mono); font-size:11px; letter-spacing:.3em; color:var(--orange); border:1px solid rgba(255,107,0,.5); padding:.35rem .7rem; margin-bottom:1.6rem; }
  .tag i { width:6px; height:6px; background:var(--orange); }
  h1 { font-size:clamp(34px,3.6vw,52px); font-weight:700; line-height:1.2; letter-spacing:.02em; }
  .spec { margin-top:2.2rem; border-top:1px solid rgba(238,240,238,.25); }
  .spec div { display:flex; justify-content:space-between; padding:.85rem 0; border-bottom:1px solid rgba(238,240,238,.16); font-size:14px; }
  .spec dt { color:rgba(238,240,238,.62); }
  .spec dd { font-family:var(--mono); letter-spacing:.08em; color:#eef0ee; }
  .spec dd b { color:var(--orange); font-weight:400; }
  /* 右：仪器面板卡（角标刻度 + 等宽标签） */
  .panel { position:relative; background:#fff; padding:38px 36px; box-shadow:0 26px 70px rgba(0,0,0,.45); }
  .panel::before,.panel::after { content:''; position:absolute; width:14px; height:14px; border:2px solid var(--orange); }
  .panel::before { top:8px; left:8px; border-right:0; border-bottom:0; }
  .panel::after { bottom:8px; right:8px; border-left:0; border-top:0; }
  .p-head { display:flex; justify-content:space-between; font-family:var(--mono); font-size:11px; letter-spacing:.18em; color:var(--mute); padding-bottom:.8rem; border-bottom:1px solid var(--line); margin-bottom:1.6rem; }
  .p-head b { color:var(--orange); font-weight:400; }
  .seg { display:flex; border:1px solid var(--line); margin-bottom:1.6rem; }
  .seg button { flex:1; border:0; background:#fff; padding:.7rem 0; font-size:14px; color:var(--mute); cursor:pointer; font-family:var(--sans); }
  .seg button.on { background:var(--ink); color:#fff; }
  .row { margin-bottom:1.2rem; }
  .row label { display:flex; justify-content:space-between; font-family:var(--mono); font-size:11px; letter-spacing:.16em; color:var(--mute); margin-bottom:.4rem; }
  .row label b { color:var(--orange); font-weight:400; }
  .row input { width:100%; border:1px solid var(--line); padding:.75rem .8rem; font-size:15px; outline:none; transition:border-color .2s, box-shadow .2s; }
  .row input:focus { border-color:var(--orange); box-shadow:0 0 0 3px rgba(255,107,0,.14); }
  .btn { width:100%; border:0; background:var(--ink); color:#fff; padding:.95rem 0; font-size:15px; letter-spacing:.24em; cursor:pointer; position:relative; overflow:hidden; }
  .btn span { position:relative; z-index:1; }
  .btn::after { content:''; position:absolute; inset:0; background:var(--orange); transform:scaleX(0); transform-origin:left; transition:transform .25s; }
  .btn:hover::after { transform:scaleX(1); }
  .p-foot { margin-top:1.1rem; display:flex; justify-content:space-between; font-size:12px; color:var(--mute); }
  .p-foot a { color:var(--orange); text-decoration:none; }
</style>
</head>
<body>
  <div class="bg"></div><div class="scrim"></div>
  <div class="wrap">
    <div class="left">
      <span class="tag"><i></i>ZW-INSIGHT / PM PLATFORM</span>
      <h1>工程项目全生命周期<br />智能管理平台</h1>
      <dl class="spec">
        <div><dt>业务覆盖</dt><dd>项目·合同·预算·财务·材料·机械·劳务·分包</dd></div>
        <div><dt>协同模式</dt><dd>多组织 / 多项目 / 实时</dd></div>
        <div><dt>决策支撑</dt><dd><b>●</b> 实时数据看板</dd></div>
      </dl>
    </div>
    <form class="panel" onsubmit="return false">
      <div class="p-head"><span>ACCESS / 登录</span><b>NO.2026</b></div>
      <div class="seg"><button class="on" type="button">密码登录</button><button type="button">短信登录</button></div>
      <div class="row"><label><span>USERNAME</span><b>01</b></label><input placeholder="用户名" /></div>
      <div class="row"><label><span>PASSWORD</span><b>02</b></label><input type="password" placeholder="密码" /></div>
      <button class="btn" type="button"><span>进入系统</span></button>
      <div class="p-foot"><span>滑块验证已就绪</span><a href="#">忘记密码？</a></div>
    </form>
  </div>
</body>
</html>
