<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>方向G · 斜切动感 Diagonal</title>
<style>
  :root { --orange:#ff6b00; --sans:"Source Han Sans SC","PingFang SC",sans-serif; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { height:100%; }
  body { font-family:var(--sans); overflow:hidden; position:relative; }
  .bg { position:absolute; inset:0; background:url("../../zw-insight-web/src/assets/login-bg-poster.jpg") center/cover no-repeat #0e1116; }
  .scrim { position:absolute; inset:0; background:linear-gradient(100deg, rgba(10,12,14,.66), rgba(10,12,14,.2) 55%, rgba(10,12,14,.5)); }
  /* 斜切橙色带 */
  .slash { position:absolute; top:-20%; right:26%; width:16vw; height:140%; background:var(--orange); transform:skewX(-14deg); opacity:.9; }
  .slash.thin { right:24%; width:2vw; opacity:.5; }
  .wrap { position:relative; height:100%; display:flex; align-items:center; justify-content:space-between; padding:0 7vw; }
  .left { color:#fff; max-width:32rem; }
  .left .k { display:inline-block; background:var(--orange); color:#fff; font-size:12px; letter-spacing:.24em; padding:.4rem .9rem; transform:skewX(-14deg); margin-bottom:1.6rem; }
  .left .k span { display:inline-block; transform:skewX(14deg); }
  h1 { font-size:clamp(38px,4.4vw,62px); font-weight:800; line-height:1.15; letter-spacing:-.01em; }
  .left p { margin-top:1.4rem; font-size:15px; line-height:1.9; color:rgba(255,255,255,.75); }
  /* 斜切卡 */
  .card { width:400px; background:#fff; padding:40px 36px; clip-path:polygon(0 0, 100% 0, 100% calc(100% - 28px), calc(100% - 28px) 100%, 0 100%); box-shadow:0 30px 80px rgba(0,0,0,.5); }
  .card h2 { font-size:24px; font-weight:800; margin-bottom:.3rem; }
  .card .s { font-size:13px; color:#888; margin-bottom:1.8rem; }
  .f { margin-bottom:1.2rem; }
  .f input { width:100%; border:0; border-bottom:2px solid #e2e5e8; padding:.7rem 0; font-size:15px; outline:none; transition:border-color .2s; }
  .f input:focus { border-bottom-color:var(--orange); }
  .btn { width:100%; border:0; background:#111; color:#fff; padding:.95rem 0; font-size:15px; letter-spacing:.2em; cursor:pointer; clip-path:polygon(0 0, 100% 0, 100% 70%, calc(100% - 14px) 100%, 0 100%); transition:background .2s; }
  .btn:hover { background:var(--orange); }
  .foot { margin-top:1.2rem; display:flex; justify-content:space-between; font-size:12px; color:#999; }
  .foot a { color:var(--orange); text-decoration:none; }
</style>
</head>
<body>
  <div class="bg"></div><div class="scrim"></div>
  <div class="slash"></div><div class="slash thin"></div>
  <div class="wrap">
    <div class="left">
      <span class="k"><span>ENGINEERING · FORWARD</span></span>
      <h1>让每个项目，<br />都向前推进。</h1>
      <p>全生命周期协同：项目、合同、预算、财务、材料、机械、劳务、分包。</p>
    </div>
    <form class="card" onsubmit="return false">
      <h2>欢迎回来</h2>
      <p class="s">登录账户，继续您的工程项目管理</p>
      <div class="f"><input placeholder="用户名" /></div>
      <div class="f"><input type="password" placeholder="密码" /></div>
      <button class="btn" type="button">进入系统</button>
      <div class="foot"><span>短信登录</span><a href="#">忘记密码？</a></div>
    </form>
  </div>
</body>
</html>
