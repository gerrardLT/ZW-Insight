<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>方向D · 工程图纸 Blueprint</title>
<style>
  :root { --orange:#ff6b00; --blue:#123a6b; --line:#c9d6e8; --mono:Consolas,Menlo,monospace; --sans:"Source Han Sans SC","PingFang SC",sans-serif; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { height:100%; }
  body { font-family:var(--sans); overflow:hidden; position:relative; }
  .bg { position:absolute; inset:0; background:url("../../zw-insight-web/src/assets/login-bg-poster.jpg") center/cover no-repeat #0e1116; }
  .scrim { position:absolute; inset:0; background:linear-gradient(90deg, rgba(8,12,20,.68), rgba(8,12,20,.25) 50%, rgba(8,12,20,.55)); }
  .wrap { position:relative; height:100%; display:flex; align-items:center; justify-content:space-between; padding:0 7vw; }
  .left { color:#eaf1fb; max-width:34rem; }
  .dim { font-family:var(--mono); font-size:12px; letter-spacing:.28em; color:#8fb3e0; margin-bottom:1.2rem; }
  h1 { font-size:clamp(36px,4vw,56px); font-weight:700; line-height:1.2; }
  h1 u { text-decoration:none; border-bottom:3px solid var(--orange); }
  .note { margin-top:1.6rem; font-family:var(--mono); font-size:13px; line-height:2; color:#a9c2e2; border-left:2px dashed var(--orange); padding-left:1rem; }
  /* 图纸卡：白底 + 蓝格 + 标题栏 */
  .sheet { position:relative; width:400px; background:#fff; background-image:linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px); background-size:24px 24px; padding:36px 34px 64px; box-shadow:0 26px 70px rgba(0,0,0,.5); }
  .sheet::before,.sheet::after { content:''; position:absolute; width:16px; height:16px; border:2px solid var(--blue); }
  .sheet::before { top:6px; left:6px; border-right:0; border-bottom:0; }
  .sheet::after { bottom:6px; right:6px; border-left:0; border-top:0; }
  .sheet h2 { font-size:22px; color:var(--blue); margin-bottom:.3rem; }
  .sheet .s { font-family:var(--mono); font-size:11px; letter-spacing:.2em; color:#5b7ba6; margin-bottom:1.6rem; }
  .f { margin-bottom:1.1rem; }
  .f label { display:block; font-family:var(--mono); font-size:11px; letter-spacing:.16em; color:#5b7ba6; margin-bottom:.35rem; }
  .f input { width:100%; border:1px dashed #9db4d4; background:rgba(255,255,255,.7); padding:.7rem .8rem; font-size:15px; color:var(--blue); outline:none; }
  .f input:focus { border-style:solid; border-color:var(--orange); }
  .btn { width:100%; border:0; background:var(--blue); color:#fff; padding:.9rem 0; font-size:15px; letter-spacing:.24em; cursor:pointer; }
  .btn:hover { background:var(--orange); }
  .titleblock { position:absolute; left:0; right:0; bottom:0; display:flex; justify-content:space-between; font-family:var(--mono); font-size:10px; letter-spacing:.14em; color:#5b7ba6; border-top:1px solid var(--line); padding:.5rem .8rem; background:#fff; }
  .titleblock b { color:var(--orange); font-weight:400; }
</style>
</head>
<body>
  <div class="bg"></div><div class="scrim"></div>
  <div class="wrap">
    <div class="left">
      <div class="dim">DWG NO. ZW-2026-LOGIN · SCALE 1:1</div>
      <h1>把工程管成<br /><u>一张精确的图纸</u>。</h1>
      <p class="note">REV 03 / 全生命周期协同<br />项目·合同·预算·财务·材料·机械·劳务·分包</p>
    </div>
    <form class="sheet" onsubmit="return false">
      <h2>登录 / SIGN IN</h2>
      <p class="s">ACCESS TERMINAL · NO.2026</p>
      <div class="f"><label>USERNAME</label><input placeholder="用户名" /></div>
      <div class="f"><label>PASSWORD</label><input type="password" placeholder="密码" /></div>
      <button class="btn" type="button">进入系统</button>
      <div class="titleblock"><span>DRAWN BY <b>ZW</b></span><span>SHEET <b>1/1</b></span></div>
    </form>
  </div>
</body>
</html>
