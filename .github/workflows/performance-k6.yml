# k6 性能基准测试 (阶段二 2.2 任务)
# 夜间低峰窗口自动执行：每晚 23:00 北京时间（cron 为 UTC 15:00）
# 约束：并发≤20,单次≤5 分钟（run-k6.sh 脚本内硬校验），租户隔离 tenant_id=9999
# 调用真实基座 tests/performance/run-k6.sh（真实验证码桥登录，无 mock）；
# 任一场景失败/阈值超限 → exit 5，job 标红，不静默吞错
name: Performance Baseline (k6 Scheduled)

on:
  schedule:
    - cron: '0 15 * * *'  # 每晚 UTC 15:00 = 北京时间 23:00（夜间低峰）
  workflow_dispatch:      # 支持手动触发

env:
  SERVER_HOST: ${{ secrets.SERVER_HOST }}
  SERVER_USER: ${{ secrets.SERVER_USER }}

jobs:
  k6-performance:
    name: Run k6 Performance Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ env.SERVER_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Execute k6 performance tests
        run: |
          # 上传仓库内最新性能脚本（与源码保持一致，避免服务器残留旧版）
          # 必须先清空远端 /tmp/zwi-perf：scp -r 对已存在目录会嵌套复制，
          # 旧版脚本残留在目录根部遮蔽新版（2026-08-14 实证，同 deploy.yml）
          ssh -i ~/.ssh/deploy_key "${{ env.SERVER_USER }}@${{ env.SERVER_HOST }}" \
            "rm -rf /tmp/zwi-perf"
          scp -i ~/.ssh/deploy_key -r tests/performance \
            "${{ env.SERVER_USER }}@${{ env.SERVER_HOST }}:/tmp/zwi-perf"
          # 调用真实基座 run-k6.sh；低峰窗口由本 cron 调度保证（北京 23:00），
          # 服务器时区未知，故 ZWI_K6_FORCE=1 豁免脚本内时段校验（并发/时长上限校验仍生效）
          ssh -i ~/.ssh/deploy_key "${{ env.SERVER_USER }}@${{ env.SERVER_HOST }}" \
            "mkdir -p /root/zw-insight/tests && rm -rf /root/zw-insight/tests/performance && \
             cp -r /tmp/zwi-perf /root/zw-insight/tests/performance && \
             cd /root/zw-insight/tests/performance && \
             ZWI_K6_FORCE=1 bash run-k6.sh all"
