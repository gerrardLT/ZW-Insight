# 依赖漏洞扫描（测试成熟度阶段二 2.3.2/2.3.3）
# OWASP dependency-check aggregate：全模块依赖 CVE 扫描，报告上传为 artifact。
# 首轮基线建立阶段不阻断构建（failBuildOnCVSS=11）；高危清单人工登记台账逐项处置后，
# 可将阈值调回 7 转为硬门槛。
# NVD API Key：若已配置 secrets.NVD_API_KEY 则自动使用（大幅提速），未配置则限速运行。
name: Dependency Security Scan

on:
  schedule:
    - cron: '0 4 * * 3'   # 每周三 04:00 UTC
  workflow_dispatch:

jobs:
  dependency-check:
    name: OWASP Dependency Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'corretto'
          cache: 'maven'

      - name: Build modules (reactor dependencies for aggregate)
        working-directory: zw-insight-server
        # aggregate 需要 reactor 内模块已构建，否则报 "could not be resolved…Try running up to package"
        run: mvn -B package -DskipTests -Djacoco.skip=true -q

      - name: Run dependency-check (aggregate)
        working-directory: zw-insight-server
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # 强制使用 NVD API Key b1cc005e-59b9-46a3-ac4c-b3b51dbdbe73(已在 GitHub Secrets 配置)
        # Key 有效时下载速度正常，失败则自动降级无 key 模式
        run: |
          ARGS="-DfailBuildOnCVSS=11"
          if [ -n "$NVD_API_KEY" ]; then
            echo "✅ 使用 NVD API Key 加速扫描..."
            ARGS="$ARGS -DnvdApiKey=$NVD_API_KEY"
          else
            echo "⚠️ 未检测到 NVD_API_KEY，将限速运行 (首次需下载 37 万条 CVE 记录)..."
          fi
          mvn -B org.owasp:dependency-check-maven:10.0.4:aggregate -Psecurity $ARGS
        continue-on-error: true

      - name: Upload dependency-check report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: zw-insight-server/**/dependency-check-report.*
          retention-days: 30
