# 依赖漏洞扫描（测试成熟度阶段二 2.3.2/2.3.3）
# OWASP dependency-check aggregate：全模块依赖 CVE 扫描，报告上传为 artifact。
# 首轮基线建立阶段不阻断构建（failBuildOnCVSS=11）；高危清单人工登记台账逐项处置后，
# 可将阈值调回 7 转为硬门槛。
# NVD API Key：若已配置 secrets.NVD_API_KEY 则自动使用（大幅提速），未配置则限速运行。
name: Dependency Security Scan

on:
  schedule:
    - cron: '0 4 * * 3'   # 每周三 04:00 UTC
  workflow_dispatch:

jobs:
  dependency-check:
    name: OWASP Dependency Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'corretto'
          cache: 'maven'

      - name: Run dependency-check (aggregate)
        working-directory: zw-insight-server
        run: >
          mvn -B org.owasp:dependency-check-maven:10.0.4:aggregate
          -Psecurity
          -DfailBuildOnCVSS=11
          -DnvdApiKey="${{ secrets.NVD_API_KEY }}"
        continue-on-error: true

      - name: Upload dependency-check report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: zw-insight-server/target/dependency-check-report.*
          retention-days: 30
