        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage-${{ matrix.project }}
          path: ${{ matrix.project }}/coverage/
          retention-days: 14

  # 鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€
  # 1.5 鍓嶇浜х墿鏋勫缓锛坮unner 渚э級鈥斺€?2026-09-24 鏂板锛屾牴娌荤敓浜ф満璧勬簮浜夋姠
