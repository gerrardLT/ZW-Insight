  # 1. 鍚庣鏋勫缓
  # 鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€
  backend:
    name: Backend Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'corretto'
          cache: maven

      # 璐ㄩ噺闂ㄦ锛氭墽琛屽叏閲忓崟鍏冩祴璇?+ JaCoCo 瑕嗙洊鐜囨姤鍛?+ 鍒嗘。瑕嗙洊鐜?check銆?
      # 2026-08-24锛堟祴璇曟垚鐔熷害鏀硅繘浜嬮」 1-B锛岀敤鎴峰喅绛栵級锛歱ackage 鍒囨崲涓?verify锛?
      # jacoco check锛堢粦瀹?verify 闃舵锛夌湡瀹炵敓鏁堬紱闂ㄦ鍒嗘。锛氭牴 pom 榛樿 0.80锛?
      # 鍚勬ā鍧楁寜 tests/coverage-baseline.json 褰撳墠鍩虹嚎瑕嗙洊 jacoco.min.coverage 灞炴€с€?
      # 鍗囨。娴佺▼锛氭ā鍧楄ˉ娴嬪悗涓婅皟鍏跺睘鎬у€煎苟鍚屾鍩虹嚎 JSON銆?
      # -T 1C 骞惰鏋勫缓锛?026-08-14 鎻愰€熶紭鍖栵級锛?2 涓嫭绔嬫ā鍧楁寜 CPU 鏍告暟骞惰缂栬瘧/娴嬭瘯锛?
      # 瀹炴祴涓茶 503s 鈫?骞惰绾?3min锛沯acoco 閫愭ā鍧?agent 浜掍笉骞叉壈锛岃鐩栫巼涓庝覆琛屼竴鑷?
      # 锛堟湰鍦板鐓ч獙璇侀€氳繃锛夈€?
      #
      # 2026-09-16 鐢ㄦ埛鍐崇瓥锛歠ast_deploy 蹇€熻矾寰勨€斺€旇烦杩囧崟娴嬩笌 jacoco 闂ㄦ锛屼粎 packge
      # 浜у嚭 jar锛堢害 2min锛夛紱浠呴檺鏈湴宸插畬鎴愭祴璇曢獙璇佺殑鏃ュ父鎺ㄩ€侊紱push 浜嬩欢涓嶅彈褰卞搷浠嶈蛋 verify銆?
      - name: Build & Unit Test (with JaCoCo)
        working-directory: zw-insight-server
        run: ${{ inputs.fast_deploy && 'mvn -B -DskipTests clean package' || 'mvn -B -T 1C clean verify' }}

      # 2026-09-16 鐢ㄦ埛鍐崇瓥锛氱Щ闄ゅ悗绔鐩栫巼鍩虹嚎姣斿闂ㄧ锛堝師閫愭ā鍧楁瘮瀵?tests/coverage-baseline.json 姝ラ锛夈€?
