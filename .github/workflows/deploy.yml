      # build:h5 澶辫触鍗崇孩鐏紱浠?zw-insight-app 鏈夎鑴氭湰锛屽叾浣欓」鐩烦杩囥€?
      - name: Build H5 bundle (uni-app)
        if: matrix.project == 'zw-insight-app'
