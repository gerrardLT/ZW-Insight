  #     鍧囨姤 exit 255锛屼絾杩滅 bash 宸茶窇瀹岋紝褰㈡垚銆孋I 鎶ュけ璐ャ€侀儴缃插疄闄呮垚鍔熴€嶇殑璇鐘舵€侊級锛?
  #   鈶?4 鏍?/ 7.6GB 涓斿彲鐢ㄥ唴瀛樹粎 1.3GB 鐨勭敓浜ф満涓婏紝鏋勫缓涓庡湪璺戠殑鐢熶骇瀹瑰櫒浜夋姠璧勬簮锛?
