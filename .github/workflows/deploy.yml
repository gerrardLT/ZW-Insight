          # 锛?tmp/zwi-perf/performance/...锛夛紝鏃х増鑴氭湰娈嬬暀鍦ㄧ洰褰曟牴閮ㄩ伄钄芥柊鐗堬紝
          # 瀵艰嚧 k6 闈欓粯璺戞棫鑴氭湰锛?026-08-14 瀹炶瘉锛氶檺閫?鍥炴敹淇鏈敓鏁堬紝
          # 2 鍒嗛挓鍐嶅爢 3939 鏉¤繍琛屼腑浠诲姟锛?
          ssh -i ~/.ssh/deploy_key "${{ env.SERVER_USER }}@${{ env.SERVER_HOST }}" \
            "rm -rf /tmp/zwi-perf"
          scp -i ~/.ssh/deploy_key -r tests/performance \
            "${{ env.SERVER_USER }}@${{ env.SERVER_HOST }}:/tmp/zwi-perf"
          # 璋冪敤鐪熷疄鍩哄骇 run-k6.sh锛堝闂寸獥鍙?骞跺彂鈮?0/鏃堕暱鈮?m 涓夐噸纭牎楠?+
          # 鐪熷疄楠岃瘉鐮佹ˉ鐧诲綍锛涗换涓€鍦烘櫙澶辫触/闃堝€艰秴闄?鈫?exit 5锛宩ob 鏍囩孩锛屼笉闈欓粯鍚為敊锛夈€?
          # ZWI_K6_FORCE=1锛歱ush 瑙﹀彂鐨勯儴缃叉祦姘寸嚎鏃犳硶閫夋嫨澶滈棿鏃舵锛岃眮鍏嶇獥鍙ｆ牎楠?
          ssh -i ~/.ssh/deploy_key "${{ env.SERVER_USER }}@${{ env.SERVER_HOST }}" \
            "mkdir -p ${{ env.DEPLOY_DIR }}/tests && rm -rf ${{ env.DEPLOY_DIR }}/tests/performance && \
             cp -r /tmp/zwi-perf ${{ env.DEPLOY_DIR }}/tests/performance && \
