      # 濡傞渶鎭㈠闂ㄧ锛氶噸鏂板姞鍥炲熀绾挎瘮瀵?step锛坓it 鍘嗗彶鍙€冿級銆?

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: zw-insight-server/**/target/surefire-reports/*.xml
