  # 鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€
  performance-test:
    name: Performance Baseline (k6)
    runs-on: ubuntu-latest
    # 蹇呴』涓茶鍦ㄩ泦鎴愭祴璇曚箣鍚庯細k6 login 鍦烘櫙楂橀鐧诲綍浼氫娇鍚岃处鍙锋椿璺冭澶囨暟瓒呰繃
    # security.max-devices(5)锛屾窐姹版渶鏃╄澶?token锛堟媺榛戯級锛屽鑷村苟鍙戣繍琛岀殑 L3/L4
    # 鑴氭湰鎸佹湁鐨?admin token 澶辨晥锛坮un 31322829488 瀹炶瘉锛歀3 4/8 鍥?401 澶辫触锛?
    needs: [deploy, integration-test]
