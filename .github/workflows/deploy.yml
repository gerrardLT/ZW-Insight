      - name: Upload JaCoCo coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-coverage-report
          path: zw-insight-server/**/target/site/jacoco/
          retention-days: 14

      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: zw-insight-server/deploy/zw-insight-app.jar
          retention-days: 3

      # L2 闆嗘垚娴嬭瘯锛圱estcontainers hermetic 浣撶郴锛寀buntu runner 鑷甫 Docker锛夈€?
      # 鍙窇 zw-app 鐨?com.zwinsight.integration.*锛園EnabledIfDockerAvailable 鏃?Docker 鑷姩璺宠繃锛夛紱
      # 鍚勬ā鍧楃洿杩炴湇鍔″櫒 DB 鐨?*IntegrationTest 涓嶅湪 CI 璺戯紙CI 鏃犳硶璁块棶鍐呯綉鏈嶅姟鍣級銆?
      # 鍖归厤鑼冨洿鐢辨牴 pom integration-test profile 鐨?failsafe includes 闄愬畾鍒?com/zwinsight/integration 鍖咃紱
      # 涓嶅啀鐢?-Dit.test锛氬疄娴嬭閫氶厤绗﹀湪 failsafe 3.1.2 闆跺尮閰嶏紝瀵艰嚧 L2 闀挎湡绌鸿浆锛?026-08-06 淇锛岃鍙拌处锛夈€?
      # 2026-08-14 闂ㄦ帶杩佺Щ锛堟彁閫熶紭鍖栵級锛歀2 灞炴祴璇曞浠讹紙瀹炴祴 302s锛夛紝涓?Integration Test
      # 鍚岀瓥鐣モ€斺€攑ush 榛樿涓嶈窇锛屼粎鎵嬪姩 dispatch run_tests=true 鏃舵墽琛岋紝涓庨棬鎺х瓥鐣ヤ竴鑷淬€?
      - name: L2 integration test (Testcontainers)
        if: github.event_name == 'workflow_dispatch' && inputs.run_tests == 'true'
        working-directory: zw-insight-server
        # failsafe 鍦ㄦ棤鍖归厤娴嬭瘯鐨勬ā鍧楋紙鏍硅仛鍚?鍏朵粬妯″潡锛変細鎶ラ敊锛?
        # 蹇呴』鐢?-Dfailsafe.failIfNoSpecifiedTests=false锛?DfailIfNoTests 浠呭 surefire 鐢熸晥锛夛紱
        # -Djacoco.skip=true锛歷erify 浼氳Е鍙?jacoco check 闂ㄦ锛堝綋鍓嶈鐩栫巼鏈揪 60%锛夛紝
        # 瑕嗙洊鐜囧畧鎶ょ敱 Build 姝ラ鐨勫熀绾挎瘮瀵硅礋璐ｏ紝L2 姝ラ涓嶉噸澶嶆鏌?
        run: mvn -B verify -pl zw-app -am -Pintegration-test -DfailIfNoTests=false -Dfailsafe.failIfNoSpecifiedTests=false -Djacoco.skip=true

  # 鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€
  # 1b. 鍓嶇鍗曞厓娴嬭瘯锛堜笁绔?matrix锛?026-08-14 M2/M3 淇锛歛pp/闂ㄦ埛鎺ュ叆锛?
  #     涓?backend 骞惰鎵ц锛屼笉澧炲姞鎬昏€楁椂锛涙瘡椤圭洰鐙珛 npm cache銆?
  #     2026-09-16 鐢ㄦ埛鍐崇瓥锛氳鐩栫巼鍩虹嚎闂ㄧ锛堝彧鍗囦笉闄嶆瘮瀵癸級宸茬Щ闄わ紝浠呬繚鐣欏崟娴?瑕嗙洊鐜囨姤鍛婁笂浼狅紱
  #     鍩虹嚎 JSON 涓?check 鑴氭湰鐣欎粨渚涙湰鍦拌嚜鏌ャ€?
  #     娉細app 鐨?@dcloudio 渚濊禆鏇捐鍐欎负涓嶅瓨鍦ㄧ増鏈?3.0.0-4010120240507001锛堢瑪璇紝
  #     registry 瀹為檯涓?40105 绯诲垪锛夛紝2026-08-14 淇鍚庢墠鑳?npm ci銆?
  # 鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€
  frontend-test:
    name: Frontend Unit Test (${{ matrix.project }})
    # fast_deploy 蹇€熻矾寰勮烦杩囦笁绔墠绔祴璇曪紙2026-09-16锛夛紱push 浜嬩欢 inputs 涓虹┖ 鈫?鎭掕窇
