          set -uo pipefail
          cd /root/zwi-deploy/test-scripts
          # 1) 鍒濆鍖栭殧绂绘祴璇曠鎴?9999 + t9999admin + t9999user锛堜綆鏉冮檺锛屼緵 authz 璐熷悜娴嬭瘯锛?
          #    + 缂栧彿瑙勫垯锛堝箓绛夛紝鑷寘鍚?docker exec SQL锛?
          #    2026-08-13 鎻愬墠鑷?L3 涔嬪墠锛歵est-api-authz.sh 渚濊禆 t9999user 绉嶅瓙锛?
          #    鍘熼『搴忥紙L3 鍏堣窇锛夊鑷?authz 鐧诲綍涓嶅瓨鍦ㄧ敤鎴疯Е鍙?IP 閿佸畾杩為攣浜嬫晠
          bash init-test-tenant.sh
          # 2) 鍑嗗 deploy-bpmn 杩愯鐜锛歷erify-base.sh + 浠?rsync 浠撳簱姹囬泦鍏ㄩ儴 BPMN 鍒?/root/zwi-deploy
          cp -f verify-base.sh /root/zwi-deploy/verify-base.sh
