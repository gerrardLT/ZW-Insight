name: CI/CD Deploy to BaoTa Server

on:
  push:
    branches: [main]
    # 纯文档提交跳过整条流水线（2026-08-13）：
    # 仅当一次 push 的全部文件都在白名单内才跳过；任何代码/脚本/配置改动触发 build + deploy。
    paths-ignore:
      - '**.md'
      - '.kiro/**'
      - 'audit-reports/**'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      target_server:
        description: '选择部署目标服务器：all（全部部署）、server1（主环境 129.204.3.200）、server2（徽颖 43.142.44.145）'
        required: true
        type: choice
        default: 'all'
        options:
          - 'all'
          - 'server1'
          - 'server2'
      run_tests:
        description: '是否跑全量测试套件（L3/L4/L5 + k6）？默认否，仅 build + deploy + 冒烟'
        required: true
        type: choice
        default: 'false'
        options:
          - 'false'
          - 'true'
      fast_deploy:
        description: '快速部署（日常最小路径，2026-09-16）：跳过后端单测+jacoco+三端前端测试，仅编译打包+部署+冒烟，约 3-5 分钟。仅限本地已完成测试验证的日常推送'
        type: boolean
        default: false
      image_tag:
        description: '可选：复用已有 GHCR 镜像标签进行部署或回滚；留空则构建当前提交'
        required: false
        type: string
        default: ''

# 测试套件触发策略（2026-08-13 用户决策：全量套件约 40 分钟，每次部署都跑等待过长）：
#   - push 默认只跑：Backend Build（L1 单测 + 覆盖率基线对比）→ Deploy → 部署冒烟
#     （健康检查 + API 文档收敛硬断言）
#   - Integration Test（L3/L4/L5）与 k6 默认不跑，唯一触发入口：
#     手动 workflow_dispatch 选 run_tests=true
#     （gh workflow run deploy.yml -f run_tests=true）
#   - 废弃方案备忘（勿再引入同类机制）：
#     ① commit message 关键字——提交信息自身描述该关键字时会被 contains() 自匹配
#       误触发（run 31697219500 实证）
#     ② github.event.repository.labels——push 事件 payload 的 repository 对象
#       不携带 labels 字段，表达式恒为假，不可用

# 并发互斥：
concurrency:
  group: deploy-production
  cancel-in-progress: true

env:
  JAVA_VERSION: '21'
  NODE_VERSION: '20'
  DEPLOY_DIR: ${{ secrets.DEPLOY_DIR || '/root/zw-insight' }}

jobs:
  # ────────────────────────────────────────────────────
  # 1. 后端构建
  # ────────────────────────────────────────────────────
  backend:
    name: Backend Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'corretto'
          cache: maven

      # 质量门槛：执行全量单元测试 + JaCoCo 覆盖率报告 + 分档覆盖率 check。
      # 2026-08-24（测试成熟度改进事项 1-B，用户决策）：package 切换为 verify，
      # jacoco check（绑定 verify 阶段）真实生效；门槛分档：根 pom 默认 0.80，
      # 各模块按 tests/coverage-baseline.json 当前基线覆盖 jacoco.min.coverage 属性。
      # 升档流程：模块补测后上调其属性值并同步基线 JSON。
      # -T 1C 并行构建（2026-08-14 提速优化）：22 个独立模块按 CPU 核数并行编译/测试，
      # 实测串行 503s → 并行约 3min；jacoco 逐模块 agent 互不干扰，覆盖率与串行一致
      # （本地对照验证通过）。
      #
      # 2026-09-16 用户决策：fast_deploy 快速路径——跳过单测与 jacoco 门槛，仅 packge
      # 产出 jar（约 2min）；仅限本地已完成测试验证的日常推送；push 事件不受影响仍走 verify。
      - name: Build & Unit Test (with JaCoCo)
        working-directory: zw-insight-server
        run: ${{ inputs.fast_deploy && 'mvn -B -DskipTests clean package' || 'mvn -B -T 1C clean verify' }}

      # 2026-09-16 用户决策：移除后端覆盖率基线比对门禁（原逐模块比对 tests/coverage-baseline.json 步骤）。
      # 保留：①pom 内置 jacoco 分档 check（mvn verify 阶段仍真实生效）②基线 JSON 留仓供本地自查。
      # 如需恢复门禁：重新加回基线比对 step（git 历史可考）。

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: zw-insight-server/**/target/surefire-reports/*.xml
          retention-days: 7

      - name: Upload JaCoCo coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-coverage-report
          path: zw-insight-server/**/target/site/jacoco/
          retention-days: 14

      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: zw-insight-server/deploy/zw-insight-app.jar
          retention-days: 3

      # L2 集成测试（Testcontainers hermetic 体系，ubuntu runner 自带 Docker）。
      # 只跑 zw-app 的 com.zwinsight.integration.*（@EnabledIfDockerAvailable 无 Docker 自动跳过）；
      # 各模块直连服务器 DB 的 *IntegrationTest 不在 CI 跑（CI 无法访问内网服务器）。
      # 匹配范围由根 pom integration-test profile 的 failsafe includes 限定到 com/zwinsight/integration 包；
      # 不再用 -Dit.test：实测该通配符在 failsafe 3.1.2 零匹配，导致 L2 长期空转（2026-08-06 修复，见台账）。
      # 2026-08-14 门控迁移（提速优化）：L2 属测试套件（实测 302s），与 Integration Test
      # 同策略——push 默认不跑，仅手动 dispatch run_tests=true 时执行，与门控策略一致。
      - name: L2 integration test (Testcontainers)
        if: github.event_name == 'workflow_dispatch' && inputs.run_tests == 'true'
        working-directory: zw-insight-server
        # failsafe 在无匹配测试的模块（根聚合/其他模块）会报错，
        # 必须用 -Dfailsafe.failIfNoSpecifiedTests=false（-DfailIfNoTests 仅对 surefire 生效）；
        # -Djacoco.skip=true：verify 会触发 jacoco check 门槛（当前覆盖率未达 60%），
        # 覆盖率守护由 Build 步骤的基线比对负责，L2 步骤不重复检查
        run: mvn -B verify -pl zw-app -am -Pintegration-test -DfailIfNoTests=false -Dfailsafe.failIfNoSpecifiedTests=false -Djacoco.skip=true

  # ────────────────────────────────────────────────────
  # 1b. 前端单元测试（三端 matrix，2026-08-14 M2/M3 修复：app/门户接入）
  #     与 backend 并行执行，不增加总耗时；每项目独立 npm cache。
  #     2026-09-16 用户决策：覆盖率基线门禁（只升不降比对）已移除，仅保留单测+覆盖率报告上传；
  #     基线 JSON 与 check 脚本留仓供本地自查。
  #     注：app 的 @dcloudio 依赖曾误写为不存在版本 3.0.0-4010120240507001（笔误，
  #     registry 实际为 40105 系列），2026-08-14 修正后才能 npm ci。
  # ────────────────────────────────────────────────────
  frontend-test:
    name: Frontend Unit Test (${{ matrix.project }})
    # fast_deploy 快速路径跳过三端前端测试（2026-09-16）；push 事件 inputs 为空 → 恒跑
    if: ${{ !inputs.fast_deploy }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [zw-insight-web, zw-insight-app, zw-supplier-portal]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ matrix.project }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ matrix.project }}
        run: npm ci --no-audit --no-fund

      # Design Tokens 门禁（2026-09-15 Phase 1.4）：禁新增裸 Hex 与 rgb()/rgba()，
      # 透明度变体统一 color-mix 派生；规则见 zw-insight-web/.stylelintrc.mjs
      - name: Stylelint design-token gate (zw-insight-web only)
        if: matrix.project == 'zw-insight-web'
        working-directory: ${{ matrix.project }}
        run: npm run lint:style

      - name: Run frontend unit tests with coverage (vitest)
        working-directory: ${{ matrix.project }}
        run: npm run test:coverage

      # 2026-09-16 用户决策：移除前端覆盖率基线门禁（原 check-frontend-coverage.mjs 步骤）。
      # 基线 JSON 与检查脚本保留在仓库，本地自查命令：node tests/check-frontend-coverage.mjs <project>

      # 移动端 H5 构建门禁（2026-08-29 移动端评估修复新增）：单测不保证可构建，
      # build:h5 失败即红灯；仅 zw-insight-app 有该脚本，其余项目跳过。
      - name: Build H5 bundle (uni-app)
        if: matrix.project == 'zw-insight-app'
        working-directory: ${{ matrix.project }}
        run: npm run build:h5

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage-${{ matrix.project }}
          path: ${{ matrix.project }}/coverage/
          retention-days: 14

  # ──────────────────────────────────────────────
  # 1.5 前端产物构建（runner 侧）—— 2026-09-24 新增，根治生产机资源争抢
  #
  # 背景：原本前端在**生产服务器上**做 `npm ci + vite build`（frontend Dockerfile 的
  # stage 1），实测后果：
  #   ① vite `rendering chunks` 阶段 5 分钟无输出 → SSH 空闲断连（run 35951954498 / 35955467495
  #     均报 exit 255，但远端 bash 已跑完，形成「CI 报失败、部署实际成功」的误导状态）；
  #   ② 4 核 / 7.6GB 且可用内存仅 1.3GB 的生产机上，构建与在跑的生产容器争抢资源，
  #     2026-09-24 实测 load average 冲到 146、sshd 无法完成 banner 交换、
  #     宿主机 nginx（80）与业务端口应用层全部超时，整机不可服务约 40 分钟，最终只能重启。
  # 改为在 runner 上构建、服务器只 COPY 产物，构建耗时从部署链路中彻底移除。
  #
  # 本 job **不受 fast_deploy 影响**（无 if 条件）：快速路径跳过的是测试，而 dist 是部署必需产物。
  # ──────────────────────────────────────────────
  frontend-build:
    name: Build Frontend Dist (runner)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: zw-insight-web/package-lock.json

      - name: Install dependencies
        working-directory: zw-insight-web
        run: npm ci --no-audit --no-fund

      - name: Build production bundle (vite)
        working-directory: zw-insight-web
        run: npm run build

      # 硬断言：产物不存在就红灯，绝不让部署阶段拿到空目录或陈旧产物
      - name: Assert dist exists
        working-directory: zw-insight-web
        run: |
          test -f dist/index.html || { echo "dist/index.html 缺失，构建未产出"; exit 1; }
          echo "--- dist 产物概览 ---"
          du -sh dist
          find dist -maxdepth 2 -type f | head -10

      - name: Upload frontend dist
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: zw-insight-web/dist/
          retention-days: 3
          if-no-files-found: error

  # ────────────────────────────────────────────────────
  # 1.8 GitHub Packages (ghcr.io) 镜像构建与推送
  #     在 Runner 侧使用 GITHUB_TOKEN 一键构建前后端镜像并推送到 ghcr.io，
  #     零外部配置成本，所有目标服务器只需 docker compose pull 即可秒级拉起，
  #     实现标准的“构建一次、到处部署”。
  # ────────────────────────────────────────────────────
  docker-publish:
    name: Build & Push Images (GHCR)
    runs-on: ubuntu-latest
    needs: [backend, frontend-test, frontend-build]
    permissions:
      contents: read
      packages: write
    if: |
      always() && needs.backend.result == 'success' &&
      needs.frontend-build.result == 'success' &&
      (needs.frontend-test.result == 'success' || needs.frontend-test.result == 'skipped')
    outputs:
      image_tag: ${{ steps.push_images.outputs.image_tag || github.sha }}
      repo_owner: ${{ steps.push_images.outputs.repo_owner }}
    steps:
      - uses: actions/checkout@v4

      - name: Download backend artifact
        if: inputs.image_tag == ''
        uses: actions/download-artifact@v4
        with:
          name: backend-jar
          path: deploy/

      - name: Download frontend dist artifact
        if: inputs.image_tag == ''
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: _frontend-dist-tmp/

      - name: Build and push images to GitHub Packages (ghcr.io)
        id: push_images
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SPECIFIED_TAG: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail
          TAG="${SPECIFIED_TAG:-${GITHUB_SHA::12}}"
          echo "image_tag=$TAG" >> "$GITHUB_OUTPUT"

          # 转为小写以兼容 Docker/GHCR 镜像命名规范
          REPO_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "repo_owner=$REPO_OWNER" >> "$GITHUB_OUTPUT"

          if [ -n "$SPECIFIED_TAG" ]; then
            echo "✅ 指定了已有镜像标签 ($SPECIFIED_TAG)，直接复用 ghcr.io 制品进行部署/回滚"
            exit 0
          fi

          # 整理前端 dist 目录结构
          if [ -f _frontend-dist-tmp/index.html ]; then
            SRC=_frontend-dist-tmp
          elif [ -f _frontend-dist-tmp/zw-insight-web/dist/index.html ]; then
            SRC=_frontend-dist-tmp/zw-insight-web/dist
          else
            echo "无法定位 dist 产物" && exit 1
          fi
          rm -rf zw-insight-web/dist
          cp -r "$SRC" zw-insight-web/dist
          rm -rf _frontend-dist-tmp

          echo "🔐 登录 GitHub Packages (ghcr.io)"
          echo "$GITHUB_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

          BACKEND_IMG="ghcr.io/${REPO_OWNER}/zwinsight-backend"
          FRONTEND_IMG="ghcr.io/${REPO_OWNER}/zwinsight-frontend"

          echo "📦 构建并推送后端镜像: ${BACKEND_IMG}:${TAG}"
          docker build -t "${BACKEND_IMG}:${TAG}" -t "${BACKEND_IMG}:latest" -f deploy/Dockerfile deploy/
          docker push "${BACKEND_IMG}:${TAG}"
          docker push "${BACKEND_IMG}:latest"

          echo "📦 构建并推送前端镜像: ${FRONTEND_IMG}:${TAG}"
          docker build -t "${FRONTEND_IMG}:${TAG}" -t "${FRONTEND_IMG}:latest" -f deploy/frontend/Dockerfile .
          docker push "${FRONTEND_IMG}:${TAG}"
          docker push "${FRONTEND_IMG}:latest"

  # ────────────────────────────────────────────────────
  # 2. 部署到目标服务器（双机并行/指定环境）
  # ────────────────────────────────────────────────────
  deploy:
    name: Deploy to ${{ matrix.server.name }} (${{ env.SERVER_HOST }})
    runs-on: ubuntu-latest
    needs: [backend, frontend-test, frontend-build, docker-publish]
    if: |
      always() && needs.backend.result == 'success' &&
      needs.frontend-build.result == 'success' &&
      (needs.frontend-test.result == 'success' || needs.frontend-test.result == 'skipped') &&
      needs.docker-publish.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        server:
          - id: server1
            name: '主服务器1 (中维)'
          - id: server2
            name: '新服务器2 (徽颖)'
    environment: production
    steps:
      - name: Filter target server
        if: inputs.target_server != 'all' && inputs.target_server != matrix.server.id && github.event_name == 'workflow_dispatch'
        run: |
          echo "跳过当前机器：指定目标为 ${{ inputs.target_server }}，当前为 ${{ matrix.server.id }}"
          exit 0

      - uses: actions/checkout@v4

      - name: Select server credentials
        env:
          SERVER1_HOST: ${{ secrets.SERVER_HOST }}
          SERVER1_USER: ${{ secrets.SERVER_USER }}
          SERVER1_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SERVER1_DIR: ${{ secrets.DEPLOY_DIR }}
          SERVER2_HOST: ${{ secrets.SERVER2_HOST }}
          SERVER2_USER: ${{ secrets.SERVER2_USER }}
          SERVER2_KEY: ${{ secrets.SERVER2_SSH_KEY }}
          SERVER2_DIR: ${{ secrets.SERVER2_DEPLOY_DIR }}
        run: |
          if [ "${{ matrix.server.id }}" = "server1" ]; then
            echo "SERVER_HOST=$SERVER1_HOST" >> "$GITHUB_ENV"
            echo "SERVER_USER=${SERVER1_USER:-root}" >> "$GITHUB_ENV"
            echo "SSH_PRIVATE_KEY<<__KEY__" >> "$GITHUB_ENV"
            echo "$SERVER1_KEY" >> "$GITHUB_ENV"
            echo "__KEY__" >> "$GITHUB_ENV"
            echo "SERVER_DEPLOY_DIR=${SERVER1_DIR:-/root/zw-insight}" >> "$GITHUB_ENV"
          else
            echo "SERVER_HOST=${SERVER2_HOST:-43.142.44.145}" >> "$GITHUB_ENV"
            echo "SERVER_USER=${SERVER2_USER:-root}" >> "$GITHUB_ENV"
            echo "SSH_PRIVATE_KEY<<__KEY__" >> "$GITHUB_ENV"
            echo "$SERVER2_KEY" >> "$GITHUB_ENV"
            echo "__KEY__" >> "$GITHUB_ENV"
            echo "SERVER_DEPLOY_DIR=${SERVER2_DIR:-/root/zw-insight}" >> "$GITHUB_ENV"
          fi

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ env.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ env.SERVER_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      # 磁盘防护①：rsync 前先清理 docker 无用资源并检查剩余空间
      - name: Pre-deploy disk guard & docker cleanup
        run: |
          ssh -i ~/.ssh/deploy_key "${{ env.SERVER_USER }}@${{ env.SERVER_HOST }}" bash -s <<'DISK_GUARD'
          set -uo pipefail
          MIN_FREE_MB=1024
          df_line=$(df -mP / | tail -1)
          avail_mb=$(echo "$df_line" | awk '{print $4}')
          echo "部署前磁盘可用空间: ${avail_mb}MB（阈值 ${MIN_FREE_MB}MB）"
          if [ "$avail_mb" -lt "$MIN_FREE_MB" ]; then
            echo "空间不足，先自动清理 docker 无用资源..."
            docker container prune -f || true
            docker image prune -f || true
            docker network prune -f || true
            docker builder prune -f || true
            avail_mb=$(df -mP / | tail -1 | awk '{print $4}')
            echo "清理后可用空间: ${avail_mb}MB"
          fi
          if [ "$avail_mb" -lt "$MIN_FREE_MB" ]; then
            echo "::error::部署目录可用空间不足，拒绝部署"
            exit 1
          fi
          DISK_GUARD

      - name: Sync deployment files to server
        run: |
          echo "🚀 同步 deploy/ 编排与初始化脚本到 ${{ matrix.server.name }}"
          ssh -i ~/.ssh/deploy_key "${{ env.SERVER_USER }}@${{ env.SERVER_HOST }}" "mkdir -p ${{ env.SERVER_DEPLOY_DIR }}/deploy"
          rsync -avz --delete \
            --exclude='.env' \
            --exclude='zw-insight-app.jar' \
            -e "ssh -i ~/.ssh/deploy_key -o ServerAliveInterval=30 -o ServerAliveCountMax=20" \
            ./deploy/ "${{ env.SERVER_USER }}@${{ env.SERVER_HOST }}:${{ env.SERVER_DEPLOY_DIR }}/deploy/"

      - name: Deploy via SSH
        env:
          DEPLOY_DIR: ${{ env.SERVER_DEPLOY_DIR }}
          IMAGE_TAG: ${{ needs.docker-publish.outputs.image_tag }}
          REPO_OWNER: ${{ needs.docker-publish.outputs.repo_owner }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ssh -i ~/.ssh/deploy_key \
            -o ServerAliveInterval=30 -o ServerAliveCountMax=60 -o TCPKeepAlive=yes \
            "${{ env.SERVER_USER }}@${{ env.SERVER_HOST }}" \
            "DEPLOY_DIR='$DEPLOY_DIR' IMAGE_TAG='$IMAGE_TAG' REPO_OWNER='$REPO_OWNER' GHCR_USER='$GHCR_USER' GHCR_TOKEN='$GHCR_TOKEN' bash -s" <<'DEPLOY_SCRIPT'
          set -euo pipefail
          DEPLOY_DIR="${DEPLOY_DIR:-/root/zw-insight}"
          cd "$DEPLOY_DIR/deploy"

          # 若首次在新服务器部署且不存在 .env，自动从 .env.example 生成初始配置
          if [ ! -f .env ] && [ -f .env.example ]; then
            echo "⚠️ 检测到新服务器尚未创建 .env，自动根据 .env.example 初始化..."
            cp .env.example .env
          fi

          set -a
          [ -f .env ] && source <(sed 's/\r$//' .env)
          set +a
          CT_PREFIX="${CONTAINER_PREFIX:-zwi}"
          DB_NAME="${MYSQL_DATABASE:-zw_insight}"

          echo "=== [1/5] 确保基础设施运行 ==="
          docker compose -f docker-compose.deploy.yml pull mysql
          docker compose -f docker-compose.deploy.yml up -d mysql redis minio rabbitmq

          echo "=== [2/5] 等待 MySQL 就绪 ==="
          for i in $(seq 1 30); do
            if docker exec "${CT_PREFIX}-mysql" sh -c 'MYSQL_PWD="$MYSQL_ROOT_PASSWORD" mysqladmin ping -h 127.0.0.1 -uroot --silent' 2>/dev/null; then
              echo "MySQL 就绪"
              break
            fi
            echo "等待 MySQL... ($i/30)"
            sleep 3
          done

          echo "=== [3/5] 清理 Flyway 失败记录 ==="
          docker exec "${CT_PREFIX}-mysql" sh -c "MYSQL_PWD=\"\$MYSQL_ROOT_PASSWORD\" mysql -uroot \"$DB_NAME\" -e 'DELETE FROM flyway_schema_history WHERE success = 0;'" 2>/dev/null || true

          echo "=== [4/5] 从 GitHub Packages (ghcr.io) 拉取并启动应用容器 ==="
          if [ -n "${GHCR_TOKEN:-}" ]; then
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin 2>/dev/null || true
          fi

          export BACKEND_IMAGE="ghcr.io/${REPO_OWNER}/zwinsight-backend"
          export FRONTEND_IMAGE="ghcr.io/${REPO_OWNER}/zwinsight-frontend"
          export IMAGE_TAG="$IMAGE_TAG"

          echo "拉取镜像: ${BACKEND_IMAGE}:${IMAGE_TAG} 与 ${FRONTEND_IMAGE}:${IMAGE_TAG} ..."
          docker compose -f docker-compose.deploy.yml pull backend frontend
          docker compose -f docker-compose.deploy.yml up -d --no-build backend frontend

          echo "=== [5/5] 清理 docker 无用资源 ==="
          docker container prune -f || true
          docker image prune -f || true
          docker network prune -f || true
          docker builder prune -f || true
          echo "--- 清理后磁盘与 docker 占用 ---"
          df -h / | tail -1

          echo ""
          echo "=== 部署完成 ==="
          docker compose -f docker-compose.deploy.yml ps
          DEPLOY_SCRIPT

      - name: Health check
        continue-on-error: true
        run: |
          REMOTE_PORT=$(ssh -i ~/.ssh/deploy_key "${{ env.SERVER_USER }}@${{ env.SERVER_HOST }}" \
            "grep -E '^BACKEND_PORT=' ${{ env.SERVER_DEPLOY_DIR }}/deploy/.env 2>/dev/null | cut -d= -f2 | tr -d '\r'" || true)
          BACKEND_PORT="${REMOTE_PORT:-18080}"
          echo "等待服务启动（端口: $BACKEND_PORT）..."
          sleep 30
          for i in $(seq 1 15); do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
              "http://${{ env.SERVER_HOST }}:${BACKEND_PORT}/api/v1/system/menu/user" || true)
            if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "401" ] || [ "$HTTP_CODE" = "403" ]; then
              echo "✅ 后端健康检查通过 (HTTP $HTTP_CODE)"
              exit 0
            fi
            echo "等待中... ($i/15, HTTP $HTTP_CODE)"
            sleep 10
          done
          echo "⚠️ 后端健康检查未通过"
          ssh -i ~/.ssh/deploy_key "${{ env.SERVER_USER }}@${{ env.SERVER_HOST }}" \
            "docker logs zwi-backend --tail 30" || true

      # 生产收敛硬断言（2026-08-10）：API 文档端点不得对公网免认证暴露，
      # 对应 docker-compose.deploy.yml 的 KNIFE4J_ENABLE/KNIFE4J_PRODUCTION/SPRINGDOC_API_DOCS_ENABLED；
      # 不静默：任一端点返回 200 则 job 标红
      - name: Verify API docs disabled in production
        run: |
          REMOTE_PORT=$(ssh -i ~/.ssh/deploy_key "${{ env.SERVER_USER }}@${{ env.SERVER_HOST }}" \
            "grep -E '^BACKEND_PORT=' ${{ env.DEPLOY_DIR }}/deploy/.env 2>/dev/null | cut -d= -f2 | tr -d '\r'" || true)
          BACKEND_PORT="${REMOTE_PORT:-18080}"
          PROBE=$(curl -s -o /dev/null -w "%{http_code}" \
            "http://${{ env.SERVER_HOST }}:${BACKEND_PORT}/api/v1/captcha/image" || true)
          if [ "$PROBE" = "000" ]; then
            echo "❌ 后端不可达，无法验证文档收敛，拒绝假通过"
            exit 1
          fi
          echo "后端可达（探针 HTTP $PROBE），开始验证文档端点收敛"
          for path in /doc.html /v3/api-docs; do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
              "http://${{ env.SERVER_HOST }}:${BACKEND_PORT}$path" || true)
            if [ "$HTTP_CODE" = "200" ]; then
              echo "❌ $path 在生产环境免认证可达 (HTTP 200)，收敛未生效"
              exit 1
            fi
            echo "✅ $path → HTTP $HTTP_CODE（未暴露）"
          done

  # ────────────────────────────────────────────────────
  # 3. 集成测试（L3 API + L4 端到端业务流）
  # ────────────────────────────────────────────────────
  integration-test:
    name: Integration Test
    runs-on: ubuntu-latest
    needs: deploy
    # 默认不跑（2026-08-13 用户决策，全量套件约 40 分钟）。
    # 唯一触发入口：手动 dispatch + run_tests=true（commit message/label
    # 方案均已废弃，原因见文件头部注释）。
    # 显式检查 needs.deploy.result：自定义 if 会覆盖默认 success() 语义，
    # 不写明则部署失败时本 job 仍会被评估
    if: |
      needs.deploy.result == 'success' &&
      github.event_name == 'workflow_dispatch' && inputs.run_tests == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ env.SERVER_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Upload test scripts
        run: |
          ssh -i ~/.ssh/deploy_key "${{ env.SERVER_USER }}@${{ env.SERVER_HOST }}" \
            "mkdir -p /root/zwi-deploy/test-scripts"

          # 上传核心基座脚本
          scp -i ~/.ssh/deploy_key keys/verify-base.sh \
            "${{ env.SERVER_USER }}@${{ env.SERVER_HOST }}:/root/zwi-deploy/test-scripts/verify-base.sh"

          # 上传 L4 lifecycle-sim-v2.sh
          scp -i ~/.ssh/deploy_key keys/lifecycle-sim-v2.sh \
            "${{ env.SERVER_USER }}@${{ env.SERVER_HOST }}:/root/zwi-deploy/test-scripts/lifecycle-sim-v2.sh"

          # 上传 L4 租户隔离基建脚本（初始化测试租户 9999）+ BPMN 部署脚本
          scp -i ~/.ssh/deploy_key keys/init-test-tenant.sh \
            "${{ env.SERVER_USER }}@${{ env.SERVER_HOST }}:/root/zwi-deploy/test-scripts/init-test-tenant.sh"
          scp -i ~/.ssh/deploy_key keys/deploy-bpmn.sh \
            "${{ env.SERVER_USER }}@${{ env.SERVER_HOST }}:/root/zwi-deploy/test-scripts/deploy-bpmn.sh"

          # 上传所有 L3 API 测试脚本
          for script in keys/test-api-*.sh; do
            scp -i ~/.ssh/deploy_key "$script" \
              "${{ env.SERVER_USER }}@${{ env.SERVER_HOST }}:/root/zwi-deploy/test-scripts/$(basename $script)"
          done

          # 统一修复换行符并赋予执行权限
          ssh -i ~/.ssh/deploy_key "${{ env.SERVER_USER }}@${{ env.SERVER_HOST }}" bash -s <<'FIX_SCRIPT'
          cd /root/zwi-deploy/test-scripts
          sed -i 's/\r$//' *.sh
          chmod +x *.sh
          FIX_SCRIPT

      - name: Init L4 test tenant (9999) & deploy BPMN
        if: always()
        run: |
          ssh -i ~/.ssh/deploy_key "${{ env.SERVER_USER }}@${{ env.SERVER_HOST }}" bash -s <<'INIT_SCRIPT'
          set -uo pipefail
          cd /root/zwi-deploy/test-scripts
          # 1) 初始化隔离测试租户 9999 + t9999admin + t9999user（低权限，供 authz 负向测试）
          #    + 编号规则（幂等，自包含 docker exec SQL）
          #    2026-08-13 提前至 L3 之前：test-api-authz.sh 依赖 t9999user 种子，
          #    原顺序（L3 先跑）导致 authz 登录不存在用户触发 IP 锁定连锁事故
          bash init-test-tenant.sh
          # 2) 准备 deploy-bpmn 运行环境：verify-base.sh + 从 rsync 仓库汇集全部 BPMN 到 /root/zwi-deploy
          cp -f verify-base.sh /root/zwi-deploy/verify-base.sh
          cp -f deploy-bpmn.sh /root/zwi-deploy/deploy-bpmn.sh
          find "${DEPLOY_DIR:-/root/zw-insight}" -path '*/src/main/resources/processes/*.bpmn20.xml' -exec cp -f {} /root/zwi-deploy/ \; 2>/dev/null || true
          # 3) 部署全部 BPMN 到租户 9999（幂等；BPMN 持久化于 ACT_RE_PROCDEF，重复部署只增版本）
          cd /root/zwi-deploy
          ZWI_USER=t9999admin ZWI_PASS=123456 ZWI_TENANT_ID=9999 bash deploy-bpmn.sh || true
          # 4) 部署全部 BPMN 到租户 1（2026-08-21 台账缺口修复：budget_change_approval/
          #    material_refund_approval/project_close_approval 等流程定义此前仅存在于租户 9999，
          #    导致 a4 预算变更/b1 材料退货/a1 结项审批链在演示租户受阻。幂等，仅全量套件触发时增版本）
          ZWI_USER=admin ZWI_PASS=123456 ZWI_TENANT_ID=1 bash deploy-bpmn.sh || true
          INIT_SCRIPT
        env:
          DEPLOY_DIR: ${{ env.DEPLOY_DIR }}

      - name: Run L3 API tests
        id: l3_test
        run: |
          ssh -i ~/.ssh/deploy_key "${{ env.SERVER_USER }}@${{ env.SERVER_HOST }}" bash -s <<'L3_SCRIPT'
          set -uo pipefail
          cd /root/zwi-deploy/test-scripts
          export ZWI_WORKDIR=/root/zwi-deploy

          L3_PASS=0
          L3_FAIL=0
          L3_RESULTS=""

          for script in test-api-*.sh; do
            [ -f "$script" ] || continue
            echo "=========================================="
            echo "执行 L3 测试: $script"
            echo "=========================================="
            if bash "$script" 2>&1 | tee "/root/zwi-deploy/l3-${script%.sh}.log"; then
              L3_PASS=$((L3_PASS + 1))
              L3_RESULTS="${L3_RESULTS}✅ ${script}\n"
            else
              L3_FAIL=$((L3_FAIL + 1))
              L3_RESULTS="${L3_RESULTS}❌ ${script}\n"
            fi
          done

          echo ""
          echo "=========================================="
          echo "L3 API 测试汇总: 通过=${L3_PASS} 失败=${L3_FAIL}"
          echo "=========================================="
          printf "%b" "$L3_RESULTS"

          # 写入汇总到结果文件
          printf "%b" "$L3_RESULTS" > /root/zwi-deploy/l3-summary.log
          echo "L3_PASS=${L3_PASS} L3_FAIL=${L3_FAIL}" >> /root/zwi-deploy/l3-summary.log

          [ "$L3_FAIL" -eq 0 ]
          L3_SCRIPT

      - name: Run L4 lifecycle test
        id: l4_test
        if: always()
        run: |
          ssh -i ~/.ssh/deploy_key "${{ env.SERVER_USER }}@${{ env.SERVER_HOST }}" bash -s <<'L4_SCRIPT'
          set -uo pipefail
          cd /root/zwi-deploy/test-scripts
          export ZWI_WORKDIR=/root/zwi-deploy

          echo "=========================================="
          echo "执行 L4 测试: lifecycle-sim-v2.sh"
          echo "=========================================="
          bash lifecycle-sim-v2.sh 2>&1 | tee /root/zwi-deploy/l4-lifecycle-result.log
          L4_SCRIPT

      - name: Setup Node.js (for L5 api-tests)
        if: always()
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run L5 api-tests (vitest, 356 cases against real API)
        if: always()
        run: |
          mkdir -p test-results
          cd zw-insight-web
          npm ci --no-audit --no-fund
          # 2026-08-15 修复（run 31853153997 实证）：22-budget/31-approval/13b/30-security
          # 等 spec 的 redis-probe 依赖 SSH（keys/zwinsight.pem 在 gitignore，CI 不存在），
          # 必须指向 deploy_key，否则 beforeAll 失败致 4 文件 failed + 71 skipped
          export E2E_SSH_KEY="$HOME/.ssh/deploy_key"
          # bash -e 下 vitest 非零会中止步骤，用 || 捕获退出码确保日志写入
          L5_EXIT=0
          npx vitest run --config e2e/api-tests/vitest.config.ts > ../test-results/l5-api-tests.log 2>&1 || L5_EXIT=$?
          echo "L5_EXIT=$L5_EXIT" >> ../test-results/l5-api-tests.log
          tail -8 ../test-results/l5-api-tests.log
          exit $L5_EXIT

      - name: Run L5 UI real tests (playwright e2e-real, 29 cases against deployed frontend :18081，2026-08-14 实测口径)
        if: always()
        run: |
          cd zw-insight-web
          # ubuntu-latest 预装 Google Chrome，playwright config 用 channel: 'chrome'；
          # auth-real.setup.ts 真实登录 :18081 生成 storageState（mock 模式已归档删除）；
          # 登录需验证码：setup 经 SSH 读服务器 Redis 取答案，CI 上指向 deploy_key（本地默认 Windows 路径不存在）
          export E2E_SSH_KEY="$HOME/.ssh/deploy_key"
          UI_REAL_EXIT=0
          npx playwright test --project=e2e-real > ../test-results/l5-ui-real.log 2>&1 || UI_REAL_EXIT=$?
          echo "UI_REAL_EXIT=$UI_REAL_EXIT" >> ../test-results/l5-ui-real.log
          tail -6 ../test-results/l5-ui-real.log
          exit $UI_REAL_EXIT

      - name: Run L5 consistency audit (playwright, 53 cases frontend-display vs backend-data，2026-08-14 实测口径)
        if: always()
        run: |
          cd zw-insight-web
          # 复用同一 storageState 前 setup 需重登，验证码答案经 SSH 读服务器 Redis（同 UI real 步骤）
          export E2E_SSH_KEY="$HOME/.ssh/deploy_key"
          CONS_EXIT=0
          npx playwright test --project=consistency-real > ../test-results/l5-consistency.log 2>&1 || CONS_EXIT=$?
          echo "CONS_EXIT=$CONS_EXIT" >> ../test-results/l5-consistency.log
          tail -6 ../test-results/l5-consistency.log
          exit $CONS_EXIT

      - name: Download test results
        if: always()
        run: |
          mkdir -p ./test-results

          # 下载 L3 结果
          scp -i ~/.ssh/deploy_key \
            "${{ env.SERVER_USER }}@${{ env.SERVER_HOST }}:/root/zwi-deploy/l3-summary.log" \
            ./test-results/l3-summary.log || true
          scp -i ~/.ssh/deploy_key \
            "${{ env.SERVER_USER }}@${{ env.SERVER_HOST }}:/root/zwi-deploy/l3-*.log" \
            ./test-results/ 2>/dev/null || true

          # 下载 L4 结果
          scp -i ~/.ssh/deploy_key \
            "${{ env.SERVER_USER }}@${{ env.SERVER_HOST }}:/root/zwi-deploy/l4-lifecycle-result.log" \
            ./test-results/l4-lifecycle-result.log || true

          # 下载 JSON 报告（如果存在）
          scp -i ~/.ssh/deploy_key \
            "${{ env.SERVER_USER }}@${{ env.SERVER_HOST }}:/root/zwi-deploy/tests/reports/lifecycle-sim-report.json" \
            ./test-results/lifecycle-sim-report.json 2>/dev/null || true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: test-results/
          retention-days: 7

      - name: Test summary
        if: always()
        run: |
          echo "=== 集成测试结果汇总 ==="
          HAS_FAILURE=false
  
          # L3 汇总
          echo ""
          echo "--- L3 API 测试 ---"
          if [ -f test-results/l3-summary.log ]; then
            cat test-results/l3-summary.log
            if grep -q "❌" test-results/l3-summary.log; then
              HAS_FAILURE=true
            fi
          else
            echo "::warning::未找到 L3 测试结果文件"
          fi
  
          # L4 汇总
          echo ""
          echo "--- L4 Lifecycle 测试 ---"
          if [ -f test-results/l4-lifecycle-result.log ]; then
            echo "成功：$(grep -c '✅' test-results/l4-lifecycle-result.log || echo 0)"
            echo "失败：$(grep -c '❌' test-results/l4-lifecycle-result.log || echo 0)"
            if grep -q "❌" test-results/l4-lifecycle-result.log; then
              HAS_FAILURE=true
            fi
          else
            echo "::warning::未找到 L4 测试结果文件"
          fi
  
          # L5 汇总（api-tests vitest 356 例，真实接口）
          echo ""
          echo "--- L5 API-Tests (vitest) ---"
          if [ -f test-results/l5-api-tests.log ]; then
            grep -E 'Test Files|Tests ' test-results/l5-api-tests.log || true
            if grep -q "L5_EXIT=0" test-results/l5-api-tests.log; then
              echo "L5 全部通过"
            else
              HAS_FAILURE=true
            fi
          else
            echo "::warning::未找到 L5 测试结果文件"
          fi
  
          # L5 UI real 汇总（playwright e2e-real 29 例，打部署前端真实登录）
          echo ""
          echo "--- L5 UI Real (playwright) ---"
          if [ -f test-results/l5-ui-real.log ]; then
            grep -E 'passed|failed|skipped' test-results/l5-ui-real.log | tail -3 || true
            if grep -q "UI_REAL_EXIT=0" test-results/l5-ui-real.log; then
              echo "L5 UI real 全部通过"
            else
              HAS_FAILURE=true
            fi
          else
            echo "::warning::未找到 L5 UI real 测试结果文件"
          fi
  
          # L5 consistency 汇总（playwright consistency-real 53 例，前端展示 vs 后端数据字段级比对）
          echo ""
          echo "--- L5 Consistency (playwright) ---"
          if [ -f test-results/l5-consistency.log ]; then
            grep -E 'passed|failed|skipped' test-results/l5-consistency.log | tail -3 || true
            if grep -q "CONS_EXIT=0" test-results/l5-consistency.log; then
              echo "L5 consistency 全部通过"
            else
              HAS_FAILURE=true
            fi
          else
            echo "::warning::未找到 L5 consistency 测试结果文件"
          fi
  
          # 最终判定
          echo ""
          if [ "$HAS_FAILURE" = "true" ]; then
            echo "::error::集成测试存在失败项，workflow 标记为失败"
            exit 1
          else
            echo "✅ 所有集成测试通过"
          fi
  
  # ────────────────────────────────────────────────────
  # 4. 性能基准测试 (k6)
  # ────────────────────────────────────────────────────
  performance-test:
    name: Performance Baseline (k6)
    runs-on: ubuntu-latest
    # 必须串行在集成测试之后：k6 login 场景高频登录会使同账号活跃设备数超过
    # security.max-devices(5)，淘汰最早设备 token（拉黑），导致并发运行的 L3/L4
    # 脚本持有的 admin token 失效（run 31322829488 实证：L3 4/8 因 401 失败）
    needs: [deploy, integration-test]
    # 与 integration-test 同门控（默认不跑）；显式要求两个依赖均成功
    if: |
      needs.deploy.result == 'success' && needs.integration-test.result == 'success' &&
      github.event_name == 'workflow_dispatch' && inputs.run_tests == 'true'
    environment: production
    steps:
      - uses: actions/checkout@v4
  
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ env.SERVER_HOST }} >> ~/.ssh/known_hosts 2>/dev/null
  
      - name: Run k6 performance tests
        run: |
          # 上传仓库内最新性能脚本（与源码保持一致，避免服务器残留旧版）
          # 必须先清空远端 /tmp/zwi-perf：scp -r 对已存在目录会嵌套复制
          # （/tmp/zwi-perf/performance/...），旧版脚本残留在目录根部遮蔽新版，
          # 导致 k6 静默跑旧脚本（2026-08-14 实证：限速/回收修复未生效，
          # 2 分钟再堆 3939 条运行中任务）
          ssh -i ~/.ssh/deploy_key "${{ env.SERVER_USER }}@${{ env.SERVER_HOST }}" \
            "rm -rf /tmp/zwi-perf"
          scp -i ~/.ssh/deploy_key -r tests/performance \
            "${{ env.SERVER_USER }}@${{ env.SERVER_HOST }}:/tmp/zwi-perf"
          # 调用真实基座 run-k6.sh（夜间窗口/并发≤20/时长≤5m 三重硬校验 +
          # 真实验证码桥登录；任一场景失败/阈值超限 → exit 5，job 标红，不静默吞错）。
          # ZWI_K6_FORCE=1：push 触发的部署流水线无法选择夜间时段，豁免窗口校验
          ssh -i ~/.ssh/deploy_key "${{ env.SERVER_USER }}@${{ env.SERVER_HOST }}" \
            "mkdir -p ${{ env.DEPLOY_DIR }}/tests && rm -rf ${{ env.DEPLOY_DIR }}/tests/performance && \
             cp -r /tmp/zwi-perf ${{ env.DEPLOY_DIR }}/tests/performance && \
             cd ${{ env.DEPLOY_DIR }}/tests/performance && \
             ZWI_K6_FORCE=1 bash run-k6.sh all"
