name: CI/CD Deploy to BaoTa Server

on:
  push:
    branches: [main]
    # 纯文档提交跳过全链路（2026-08-13，用户反馈等待时间过长）：
    # 仅当一次 push 的全部文件都在白名单内才跳过；任何代码/脚本/配置改动照常全链路。
    # 安全边界：tests/coverage-baseline.json 影响 CI 比对逻辑不在白名单；
    # keys/**（L3/L4/L5 脚本）不在白名单（脚本改动必须实跑验证）。
    paths-ignore:
      - '**.md'
      - '.kiro/**'
      - 'audit-reports/**'
      - 'docs/**'
  workflow_dispatch:

# 并发互斥（用户决策 2026-08-10，方案 A）：单服务器部署只有最新提交有意义，
# 新 push 取消正在跑的旧流水线，避免两条流水线并行操作同一台服务器
# （实证事故：2026-08-10 run 31346854580 跑 k6 时被 run 31347158609 的部署重启干扰，
# 登录失败率超阈值标红）。部署脚本幂等（scp jar+重启），中途被取消的脏状态由后续 run 覆盖修复。
# 注：performance-k6.yml cron 不入本组——cancel-in-progress 对称生效，
# cron 若取消正在部署的流水线代价更高，且 23:00 低峰窗口与 push 碰撞概率极低。
concurrency:
  group: deploy-production
  cancel-in-progress: true

env:
  JAVA_VERSION: '21'
  NODE_VERSION: '20'
  SERVER_HOST: ${{ secrets.SERVER_HOST }}
  SERVER_USER: ${{ secrets.SERVER_USER }}
  DEPLOY_DIR: ${{ secrets.DEPLOY_DIR || '/root/zw-insight' }}

jobs:
  # ────────────────────────────────────────────────────
  # 1. 后端构建
  # ────────────────────────────────────────────────────
  backend:
    name: Backend Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'corretto'
          cache: maven

      # 质量门槛：执行全量单元测试 + JaCoCo 覆盖率报告（package 阶段不触发 check 门槛，
      # check 绑定 verify 阶段；覆盖率报告作为 artifact 上传供查阅）。
      # 若需强制覆盖率门槛（BUNDLE LINE ≥60%），将 package 换为 verify（见 spec test-maturity-upgrade 3.3）。
      - name: Build & Unit Test (with JaCoCo)
        working-directory: zw-insight-server
        run: mvn -B clean package

      # 覆盖率不回退守护：逐模块比对 tests/coverage-baseline.json（千分比，容忍 ±1‰ 波动），
      # 任一模块下降即构建失败。基线只许升不许降，更新需提交新 JSON。
      # 见 .kiro/specs/test-maturity-upgrade/design.md D1
      - name: Coverage baseline check (no regression)
        working-directory: zw-insight-server
        run: |
          BASELINE="../tests/coverage-baseline.json"
          if [ ! -f "$BASELINE" ]; then
            echo "::error::tests/coverage-baseline.json 不存在，无法比对覆盖率基线"
            exit 1
          fi
          FAIL=0
          for csv in zw-*/target/site/jacoco/jacoco.csv; do
            [ -f "$csv" ] || continue
            module=$(echo "$csv" | cut -d/ -f1)
            base=$(python3 -c "import json,sys; d=json.load(open('$BASELINE')); v=d.get('$module'); sys.exit(0) if v is None else print(v)" 2>/dev/null || true)
            [ -n "$base" ] || continue
            awk -F, -v base="$base" -v m="$module" '
              NR>1 { cov += $9; miss += $8 }
              END {
                total = cov + miss
                if (total == 0) exit 0
                cur = int(cov * 1000 / total)
                if (cur < base - 1) {
                  printf "\xe2\x9d\x8c %s 覆盖率回退: 当前 %d\xe2\x80\xb0 < 基线 %d\xe2\x80\xb0\n", m, cur, base
                  exit 1
                } else {
                  printf "\xe2\x9c\x85 %s 覆盖率: 当前 %d\xe2\x80\xb0 >= 基线 %d\xe2\x80\xb0\n", m, cur, base
                }
              }' "$csv" || FAIL=1
          done
          if [ "$FAIL" -ne 0 ]; then
            echo "::error::存在模块覆盖率低于基线，请补测或说明后更新基线 JSON（只许升不许降）"
            exit 1
          fi

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: zw-insight-server/**/target/surefire-reports/*.xml
          retention-days: 7

      - name: Upload JaCoCo coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-coverage-report
          path: zw-insight-server/**/target/site/jacoco/
          retention-days: 14

      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: zw-insight-server/deploy/zw-insight-app.jar
          retention-days: 3

      # L2 集成测试（Testcontainers hermetic 体系，ubuntu runner 自带 Docker）。
      # 只跑 zw-app 的 com.zwinsight.integration.*（@EnabledIfDockerAvailable 无 Docker 自动跳过）；
      # 各模块直连服务器 DB 的 *IntegrationTest 不在 CI 跑（CI 无法访问内网服务器）。
      # 匹配范围由根 pom integration-test profile 的 failsafe includes 限定到 com/zwinsight/integration 包；
      # 不再用 -Dit.test：实测该通配符在 failsafe 3.1.2 零匹配，导致 L2 长期空转（2026-08-06 修复，见台账）。
      - name: L2 integration test (Testcontainers)
        working-directory: zw-insight-server
        # failsafe 在无匹配测试的模块（根聚合/其他模块）会报错，
        # 必须用 -Dfailsafe.failIfNoSpecifiedTests=false（-DfailIfNoTests 仅对 surefire 生效）；
        # -Djacoco.skip=true：verify 会触发 jacoco check 门槛（当前覆盖率未达 60%），
        # 覆盖率守护由 Build 步骤的基线比对负责，L2 步骤不重复检查
        run: mvn -B verify -pl zw-app -am -Pintegration-test -DfailIfNoTests=false -Dfailsafe.failIfNoSpecifiedTests=false -Djacoco.skip=true

  # ────────────────────────────────────────────────────
  # 2. 部署到宝塔服务器
  # ────────────────────────────────────────────────────
  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    needs: backend
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Download backend artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-jar
          path: deploy/

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ env.SERVER_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      # 磁盘防护①（2026-08-13，run 31613613775 磁盘满事故后新增）：
      # rsync 前先清理 docker 无用资源并检查剩余空间，不足则快速失败（附诊断），
      # 避免传到一半报 No space left on device 留下半截 jar
      - name: Pre-deploy disk guard & docker cleanup
        run: |
          ssh -i ~/.ssh/deploy_key "${{ env.SERVER_USER }}@${{ env.SERVER_HOST }}" bash -s <<'DISK_GUARD'
          set -uo pipefail
          MIN_FREE_MB=1024
          df_line=$(df -mP / | tail -1)
          avail_mb=$(echo "$df_line" | awk '{print $4}')
          echo "部署前磁盘可用空间: ${avail_mb}MB（阈值 ${MIN_FREE_MB}MB）"
          if [ "$avail_mb" -lt "$MIN_FREE_MB" ]; then
            echo "空间不足，先自动清理 docker 无用资源（停止容器/悬空镜像/无用网络/构建缓存）..."
            docker container prune -f || true
            docker image prune -f || true
            docker network prune -f || true
            docker builder prune -f || true
            avail_mb=$(df -mP / | tail -1 | awk '{print $4}')
            echo "清理后可用空间: ${avail_mb}MB"
            echo "--- docker system df ---"
            docker system df || true
            echo "--- / 占用 Top10 ---"
            du -x -m --max-depth=2 / 2>/dev/null | sort -rn | head -10 || true
          fi
          if [ "$avail_mb" -lt "$MIN_FREE_MB" ]; then
            echo "::error::部署目录可用空间 ${avail_mb}MB 低于 ${MIN_FREE_MB}MB，自动清理后仍不足，拒绝部署（防半截 jar）"
            exit 1
          fi
          DISK_GUARD

      - name: Sync project to server
        run: |
          rsync -avz --delete \
            --exclude='.git/' \
            --exclude='node_modules/' \
            --exclude='**/target/' \
            --exclude='**/dist/' \
            --exclude='test-results/' \
            --exclude='.kiro/' \
            --exclude='deploy/.env' \
            -e "ssh -i ~/.ssh/deploy_key" \
            ./ "${{ env.SERVER_USER }}@${{ env.SERVER_HOST }}:${{ env.DEPLOY_DIR }}/"

      - name: Deploy via SSH
        run: |
          ssh -i ~/.ssh/deploy_key "${{ env.SERVER_USER }}@${{ env.SERVER_HOST }}" bash -s <<'DEPLOY_SCRIPT'
          set -euo pipefail
          DEPLOY_DIR="${DEPLOY_DIR:-/root/zw-insight}"
          cd "$DEPLOY_DIR/deploy"

          echo "=== [1/5] 确保基础设施运行 ==="
          # 拉取最新 MySQL 镜像（升级到 8.0.37 以支持 IF NOT EXISTS 语法）
          docker compose -f docker-compose.deploy.yml pull mysql
          # 启动 MySQL/Redis/MinIO/RabbitMQ（如已运行则无操作，如镜像更新则自动重建）
          docker compose -f docker-compose.deploy.yml up -d mysql redis minio rabbitmq

          echo "=== [2/5] 等待 MySQL 就绪 ==="
          for i in $(seq 1 30); do
            if docker exec zwi-mysql mysqladmin ping -h 127.0.0.1 -uroot -pzwinsight123 --silent 2>/dev/null; then
              echo "MySQL 就绪"
              break
            fi
            echo "等待 MySQL... ($i/30)"
            sleep 3
          done

          echo "=== [3/5] 清理 Flyway 失败记录 ==="
          # 直接清理（表不存在或无记录时静默忽略）
          docker exec zwi-mysql mysql -uroot -pzwinsight123 zw_insight \
            -e "DELETE FROM flyway_schema_history WHERE success = 0;" 2>/dev/null || true

          echo "=== [4/5] 重建并启动应用容器 ==="
          # 只停止并重建 backend 和 frontend，基础设施保持运行
          docker compose -f docker-compose.deploy.yml stop backend frontend 2>/dev/null || true
          docker rm -f zwi-backend zwi-frontend 2>/dev/null || true
          docker compose -f docker-compose.deploy.yml build --no-cache backend frontend
          docker compose -f docker-compose.deploy.yml up -d backend frontend

          echo "=== [5/5] 清理 docker 无用资源（镜像/容器/网络/构建缓存） ==="
          # 2026-08-13 强化：每次部署 build --no-cache 会累积旧镜像层与构建缓存，
          # 原来仅 docker image prune -f（悬空镜像）不足以防磁盘满（run 31613613775 事故）。
          # 不用 system prune -a：避免误删其他 compose 栈镜像；prune 只清未被运行容器引用的资源，
          # 正在运行的 mysql/redis/minio/rabbitmq/backend/frontend 不受影响。清理失败不阻断部署。
          docker container prune -f || true
          docker image prune -f || true
          docker network prune -f || true
          docker builder prune -f || true
          echo "--- 清理后磁盘与 docker 占用 ---"
          df -h / | tail -1
          docker system df || true

          echo ""
          echo "=== 部署完成 ==="
          docker compose -f docker-compose.deploy.yml ps
          DEPLOY_SCRIPT
        env:
          DEPLOY_DIR: ${{ env.DEPLOY_DIR }}

      - name: Health check
        continue-on-error: true
        run: |
          echo "等待服务启动（Spring Boot + Flyway 迁移）..."
          sleep 30
          for i in $(seq 1 15); do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
              "http://${{ env.SERVER_HOST }}:18080/api/v1/system/menu/user" || true)
            if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "401" ] || [ "$HTTP_CODE" = "403" ]; then
              echo "✅ 后端健康检查通过 (HTTP $HTTP_CODE)"
              exit 0
            fi
            echo "等待中... ($i/15, HTTP $HTTP_CODE)"
            sleep 10
          done
          echo "⚠️ 后端健康检查未通过，服务可能仍在启动中，请手动检查服务器日志"
          ssh -i ~/.ssh/deploy_key "${{ env.SERVER_USER }}@${{ env.SERVER_HOST }}" \
            "docker logs zwi-backend --tail 30" || true

      # 生产收敛硬断言（2026-08-10）：API 文档端点不得对公网免认证暴露，
      # 对应 docker-compose.deploy.yml 的 KNIFE4J_ENABLE/KNIFE4J_PRODUCTION/SPRINGDOC_API_DOCS_ENABLED；
      # 不静默：任一端点返回 200 则 job 标红
      - name: Verify API docs disabled in production
        run: |
          # 前置：确认后端可达（避免服务未启动时 curl 000 被误判为“未暴露”的假通过）
          PROBE=$(curl -s -o /dev/null -w "%{http_code}" \
            "http://${{ env.SERVER_HOST }}:18080/api/v1/captcha/image" || true)
          if [ "$PROBE" = "000" ]; then
            echo "❌ 后端不可达，无法验证文档收敛，拒绝假通过"
            exit 1
          fi
          echo "后端可达（探针 HTTP $PROBE），开始验证文档端点收敛"
          for path in /doc.html /v3/api-docs; do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
              "http://${{ env.SERVER_HOST }}:18080$path" || true)
            if [ "$HTTP_CODE" = "200" ]; then
              echo "❌ $path 在生产环境免认证可达 (HTTP 200)，收敛未生效"
              exit 1
            fi
            echo "✅ $path → HTTP $HTTP_CODE（未暴露）"
          done

  # ────────────────────────────────────────────────────
  # 3. 集成测试（L3 API + L4 端到端业务流）
  # ────────────────────────────────────────────────────
  integration-test:
    name: Integration Test
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ env.SERVER_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Upload test scripts
        run: |
          ssh -i ~/.ssh/deploy_key "${{ env.SERVER_USER }}@${{ env.SERVER_HOST }}" \
            "mkdir -p /root/zwi-deploy/test-scripts"

          # 上传核心基座脚本
          scp -i ~/.ssh/deploy_key keys/verify-base.sh \
            "${{ env.SERVER_USER }}@${{ env.SERVER_HOST }}:/root/zwi-deploy/test-scripts/verify-base.sh"

          # 上传 L4 lifecycle-sim-v2.sh
          scp -i ~/.ssh/deploy_key keys/lifecycle-sim-v2.sh \
            "${{ env.SERVER_USER }}@${{ env.SERVER_HOST }}:/root/zwi-deploy/test-scripts/lifecycle-sim-v2.sh"

          # 上传 L4 租户隔离基建脚本（初始化测试租户 9999）+ BPMN 部署脚本
          scp -i ~/.ssh/deploy_key keys/init-test-tenant.sh \
            "${{ env.SERVER_USER }}@${{ env.SERVER_HOST }}:/root/zwi-deploy/test-scripts/init-test-tenant.sh"
          scp -i ~/.ssh/deploy_key keys/deploy-bpmn.sh \
            "${{ env.SERVER_USER }}@${{ env.SERVER_HOST }}:/root/zwi-deploy/test-scripts/deploy-bpmn.sh"

          # 上传所有 L3 API 测试脚本
          for script in keys/test-api-*.sh; do
            scp -i ~/.ssh/deploy_key "$script" \
              "${{ env.SERVER_USER }}@${{ env.SERVER_HOST }}:/root/zwi-deploy/test-scripts/$(basename $script)"
          done

          # 统一修复换行符并赋予执行权限
          ssh -i ~/.ssh/deploy_key "${{ env.SERVER_USER }}@${{ env.SERVER_HOST }}" bash -s <<'FIX_SCRIPT'
          cd /root/zwi-deploy/test-scripts
          sed -i 's/\r$//' *.sh
          chmod +x *.sh
          FIX_SCRIPT

      - name: Init L4 test tenant (9999) & deploy BPMN
        if: always()
        run: |
          ssh -i ~/.ssh/deploy_key "${{ env.SERVER_USER }}@${{ env.SERVER_HOST }}" bash -s <<'INIT_SCRIPT'
          set -uo pipefail
          cd /root/zwi-deploy/test-scripts
          # 1) 初始化隔离测试租户 9999 + t9999admin + t9999user（低权限，供 authz 负向测试）
          #    + 编号规则（幂等，自包含 docker exec SQL）
          #    2026-08-13 提前至 L3 之前：test-api-authz.sh 依赖 t9999user 种子，
          #    原顺序（L3 先跑）导致 authz 登录不存在用户触发 IP 锁定连锁事故
          bash init-test-tenant.sh
          # 2) 准备 deploy-bpmn 运行环境：verify-base.sh + 从 rsync 仓库汇集全部 BPMN 到 /root/zwi-deploy
          cp -f verify-base.sh /root/zwi-deploy/verify-base.sh
          cp -f deploy-bpmn.sh /root/zwi-deploy/deploy-bpmn.sh
          find "${DEPLOY_DIR:-/root/zw-insight}" -path '*/src/main/resources/processes/*.bpmn20.xml' -exec cp -f {} /root/zwi-deploy/ \; 2>/dev/null || true
          # 3) 部署全部 BPMN 到租户 9999（幂等；BPMN 持久化于 ACT_RE_PROCDEF，重复部署只增版本）
          cd /root/zwi-deploy
          ZWI_USER=t9999admin ZWI_PASS=123456 ZWI_TENANT_ID=9999 bash deploy-bpmn.sh || true
          INIT_SCRIPT
        env:
          DEPLOY_DIR: ${{ env.DEPLOY_DIR }}

      - name: Run L3 API tests
        id: l3_test
        run: |
          ssh -i ~/.ssh/deploy_key "${{ env.SERVER_USER }}@${{ env.SERVER_HOST }}" bash -s <<'L3_SCRIPT'
          set -uo pipefail
          cd /root/zwi-deploy/test-scripts
          export ZWI_WORKDIR=/root/zwi-deploy

          L3_PASS=0
          L3_FAIL=0
          L3_RESULTS=""

          for script in test-api-*.sh; do
            [ -f "$script" ] || continue
            echo "=========================================="
            echo "执行 L3 测试: $script"
            echo "=========================================="
            if bash "$script" 2>&1 | tee "/root/zwi-deploy/l3-${script%.sh}.log"; then
              L3_PASS=$((L3_PASS + 1))
              L3_RESULTS="${L3_RESULTS}✅ ${script}\n"
            else
              L3_FAIL=$((L3_FAIL + 1))
              L3_RESULTS="${L3_RESULTS}❌ ${script}\n"
            fi
          done

          echo ""
          echo "=========================================="
          echo "L3 API 测试汇总: 通过=${L3_PASS} 失败=${L3_FAIL}"
          echo "=========================================="
          printf "%b" "$L3_RESULTS"

          # 写入汇总到结果文件
          printf "%b" "$L3_RESULTS" > /root/zwi-deploy/l3-summary.log
          echo "L3_PASS=${L3_PASS} L3_FAIL=${L3_FAIL}" >> /root/zwi-deploy/l3-summary.log

          [ "$L3_FAIL" -eq 0 ]
          L3_SCRIPT

      - name: Run L4 lifecycle test
        id: l4_test
        if: always()
        run: |
          ssh -i ~/.ssh/deploy_key "${{ env.SERVER_USER }}@${{ env.SERVER_HOST }}" bash -s <<'L4_SCRIPT'
          set -uo pipefail
          cd /root/zwi-deploy/test-scripts
          export ZWI_WORKDIR=/root/zwi-deploy

          echo "=========================================="
          echo "执行 L4 测试: lifecycle-sim-v2.sh"
          echo "=========================================="
          bash lifecycle-sim-v2.sh 2>&1 | tee /root/zwi-deploy/l4-lifecycle-result.log
          L4_SCRIPT

      - name: Setup Node.js (for L5 api-tests)
        if: always()
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run L5 api-tests (vitest, 356 cases against real API)
        if: always()
        run: |
          mkdir -p test-results
          cd zw-insight-web
          npm ci --no-audit --no-fund
          # bash -e 下 vitest 非零会中止步骤，用 || 捕获退出码确保日志写入
          L5_EXIT=0
          npx vitest run --config e2e/api-tests/vitest.config.ts > ../test-results/l5-api-tests.log 2>&1 || L5_EXIT=$?
          echo "L5_EXIT=$L5_EXIT" >> ../test-results/l5-api-tests.log
          tail -8 ../test-results/l5-api-tests.log
          exit $L5_EXIT

      - name: Run L5 UI real tests (playwright e2e-real, 30 cases against deployed frontend :18081)
        if: always()
        run: |
          cd zw-insight-web
          # ubuntu-latest 预装 Google Chrome，playwright config 用 channel: 'chrome'；
          # auth-real.setup.ts 真实登录 :18081 生成 storageState（mock 模式已归档删除）；
          # 登录需验证码：setup 经 SSH 读服务器 Redis 取答案，CI 上指向 deploy_key（本地默认 Windows 路径不存在）
          export E2E_SSH_KEY="$HOME/.ssh/deploy_key"
          UI_REAL_EXIT=0
          npx playwright test --project=e2e-real > ../test-results/l5-ui-real.log 2>&1 || UI_REAL_EXIT=$?
          echo "UI_REAL_EXIT=$UI_REAL_EXIT" >> ../test-results/l5-ui-real.log
          tail -6 ../test-results/l5-ui-real.log
          exit $UI_REAL_EXIT

      - name: Run L5 consistency audit (playwright, 54 cases frontend-display vs backend-data)
        if: always()
        run: |
          cd zw-insight-web
          # 复用同一 storageState 前 setup 需重登，验证码答案经 SSH 读服务器 Redis（同 UI real 步骤）
          export E2E_SSH_KEY="$HOME/.ssh/deploy_key"
          CONS_EXIT=0
          npx playwright test --project=consistency-real > ../test-results/l5-consistency.log 2>&1 || CONS_EXIT=$?
          echo "CONS_EXIT=$CONS_EXIT" >> ../test-results/l5-consistency.log
          tail -6 ../test-results/l5-consistency.log
          exit $CONS_EXIT

      - name: Download test results
        if: always()
        run: |
          mkdir -p ./test-results

          # 下载 L3 结果
          scp -i ~/.ssh/deploy_key \
            "${{ env.SERVER_USER }}@${{ env.SERVER_HOST }}:/root/zwi-deploy/l3-summary.log" \
            ./test-results/l3-summary.log || true
          scp -i ~/.ssh/deploy_key \
            "${{ env.SERVER_USER }}@${{ env.SERVER_HOST }}:/root/zwi-deploy/l3-*.log" \
            ./test-results/ 2>/dev/null || true

          # 下载 L4 结果
          scp -i ~/.ssh/deploy_key \
            "${{ env.SERVER_USER }}@${{ env.SERVER_HOST }}:/root/zwi-deploy/l4-lifecycle-result.log" \
            ./test-results/l4-lifecycle-result.log || true

          # 下载 JSON 报告（如果存在）
          scp -i ~/.ssh/deploy_key \
            "${{ env.SERVER_USER }}@${{ env.SERVER_HOST }}:/root/zwi-deploy/tests/reports/lifecycle-sim-report.json" \
            ./test-results/lifecycle-sim-report.json 2>/dev/null || true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: test-results/
          retention-days: 7

      - name: Test summary
        if: always()
        run: |
          echo "=== 集成测试结果汇总 ==="
          HAS_FAILURE=false
  
          # L3 汇总
          echo ""
          echo "--- L3 API 测试 ---"
          if [ -f test-results/l3-summary.log ]; then
            cat test-results/l3-summary.log
            if grep -q "❌" test-results/l3-summary.log; then
              HAS_FAILURE=true
            fi
          else
            echo "::warning::未找到 L3 测试结果文件"
          fi
  
          # L4 汇总
          echo ""
          echo "--- L4 Lifecycle 测试 ---"
          if [ -f test-results/l4-lifecycle-result.log ]; then
            echo "成功：$(grep -c '✅' test-results/l4-lifecycle-result.log || echo 0)"
            echo "失败：$(grep -c '❌' test-results/l4-lifecycle-result.log || echo 0)"
            if grep -q "❌" test-results/l4-lifecycle-result.log; then
              HAS_FAILURE=true
            fi
          else
            echo "::warning::未找到 L4 测试结果文件"
          fi
  
          # L5 汇总（api-tests vitest 356 例，真实接口）
          echo ""
          echo "--- L5 API-Tests (vitest) ---"
          if [ -f test-results/l5-api-tests.log ]; then
            grep -E 'Test Files|Tests ' test-results/l5-api-tests.log || true
            if grep -q "L5_EXIT=0" test-results/l5-api-tests.log; then
              echo "L5 全部通过"
            else
              HAS_FAILURE=true
            fi
          else
            echo "::warning::未找到 L5 测试结果文件"
          fi
  
          # L5 UI real 汇总（playwright e2e-real 30 例，打部署前端真实登录）
          echo ""
          echo "--- L5 UI Real (playwright) ---"
          if [ -f test-results/l5-ui-real.log ]; then
            grep -E 'passed|failed|skipped' test-results/l5-ui-real.log | tail -3 || true
            if grep -q "UI_REAL_EXIT=0" test-results/l5-ui-real.log; then
              echo "L5 UI real 全部通过"
            else
              HAS_FAILURE=true
            fi
          else
            echo "::warning::未找到 L5 UI real 测试结果文件"
          fi
  
          # L5 consistency 汇总（playwright consistency-real 54 例，前端展示 vs 后端数据字段级比对）
          echo ""
          echo "--- L5 Consistency (playwright) ---"
          if [ -f test-results/l5-consistency.log ]; then
            grep -E 'passed|failed|skipped' test-results/l5-consistency.log | tail -3 || true
            if grep -q "CONS_EXIT=0" test-results/l5-consistency.log; then
              echo "L5 consistency 全部通过"
            else
              HAS_FAILURE=true
            fi
          else
            echo "::warning::未找到 L5 consistency 测试结果文件"
          fi
  
          # 最终判定
          echo ""
          if [ "$HAS_FAILURE" = "true" ]; then
            echo "::error::集成测试存在失败项，workflow 标记为失败"
            exit 1
          else
            echo "✅ 所有集成测试通过"
          fi
  
  # ────────────────────────────────────────────────────
  # 4. 性能基准测试 (k6)
  # ────────────────────────────────────────────────────
  performance-test:
    name: Performance Baseline (k6)
    runs-on: ubuntu-latest
    # 必须串行在集成测试之后：k6 login 场景高频登录会使同账号活跃设备数超过
    # security.max-devices(5)，淘汰最早设备 token（拉黑），导致并发运行的 L3/L4
    # 脚本持有的 admin token 失效（run 31322829488 实证：L3 4/8 因 401 失败）
    needs: [deploy, integration-test]
    if: success()  # 仅部署与集成测试均成功后执行
    environment: production
    steps:
      - uses: actions/checkout@v4
  
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ env.SERVER_HOST }} >> ~/.ssh/known_hosts 2>/dev/null
  
      - name: Run k6 performance tests
        run: |
          # 上传仓库内最新性能脚本（与源码保持一致，避免服务器残留旧版）
          scp -i ~/.ssh/deploy_key -r tests/performance \
            "${{ env.SERVER_USER }}@${{ env.SERVER_HOST }}:/tmp/zwi-perf"
          # 调用真实基座 run-k6.sh（夜间窗口/并发≤20/时长≤5m 三重硬校验 +
          # 真实验证码桥登录；任一场景失败/阈值超限 → exit 5，job 标红，不静默吞错）。
          # ZWI_K6_FORCE=1：push 触发的部署流水线无法选择夜间时段，豁免窗口校验
          ssh -i ~/.ssh/deploy_key "${{ env.SERVER_USER }}@${{ env.SERVER_HOST }}" \
            "mkdir -p ${{ env.DEPLOY_DIR }}/tests && rm -rf ${{ env.DEPLOY_DIR }}/tests/performance && \
             cp -r /tmp/zwi-perf ${{ env.DEPLOY_DIR }}/tests/performance && \
             cd ${{ env.DEPLOY_DIR }}/tests/performance && \
             ZWI_K6_FORCE=1 bash run-k6.sh all"
