          find "${DEPLOY_DIR:-/root/zw-insight}" -path '*/src/main/resources/processes/*.bpmn20.xml' -exec cp -f {} /root/zwi-deploy/ \; 2>/dev/null || true
          # 3) 閮ㄧ讲鍏ㄩ儴 BPMN 鍒扮鎴?9999锛堝箓绛夛紱BPMN 鎸佷箙鍖栦簬 ACT_RE_PROCDEF锛岄噸澶嶉儴缃插彧澧炵増鏈級
          cd /root/zwi-deploy
          ZWI_USER=t9999admin ZWI_PASS=123456 ZWI_TENANT_ID=9999 bash deploy-bpmn.sh || true
          # 4) 閮ㄧ讲鍏ㄩ儴 BPMN 鍒扮鎴?1锛?026-08-21 鍙拌处缂哄彛淇锛歜udget_change_approval/
          #    material_refund_approval/project_close_approval 绛夋祦绋嬪畾涔夋鍓嶄粎瀛樺湪浜庣鎴?9999锛?
