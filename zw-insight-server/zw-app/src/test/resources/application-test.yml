# 集成测试环境配置
# Testcontainers 会动态覆盖 datasource 与 redis 连接信息（@DynamicPropertySource）

# MinIO 哑配置：MinioClient Bean 创建时 endpoint 不能为 null，
# 仅满足启动（集成测试不实际调用文件上传，无需真实 MinIO）。
# 2026-08-05 CI 首跑暴露“endpoint must not be null”
minio:
  endpoint: http://localhost:9000
  access-key: test
  secret-key: test
  bucket: test-bucket

spring:
  # 集成测试用 Testcontainers withInitScript(init-test-schema.sql) 建表，
  # 禁用 Flyway：迁移脚本依赖完整建表顺序，与 initScript 并存会报
  # “Table 'zw_test.biz_project' doesn't exist”（2026-08-05 CI 首跑暴露）
  flyway:
    enabled: false
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # Testcontainers 动态注入 URL
    url: jdbc:mysql://localhost:3306/zw_test?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
    username: root
    password: test
    # Druid fail-fast（2026-08-06 L2 真跑暴露挂起根因）：
    # 测试类结束后 Testcontainers 销毁容器，Druid 的 CreateConnectionThread（非守护线程）
    # 默认对失效连接无限重试建连，fork JVM 无法退出 → Maven 挂死。
    # break-after-acquire-failure=true：建连失败即放弃并退出重试线程；
    # connection-error-retry-attempts=0：出错不重试。测试场景无需连接自愈。
    druid:
      break-after-acquire-failure: true
      connection-error-retry-attempts: 0
  data:
    redis:
      host: localhost
      port: 6379

  # 关闭 Flowable 自动部署（集成测试中按需手动部署流程定义）
  flowable:
    database-schema-update: true
    async-executor-activate: false

  # 关闭 RabbitMQ（集成测试不依赖 MQ）
  rabbitmq:
    host: localhost
    port: 5672

# MyBatis-Plus 配置
mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# 日志级别
logging:
  level:
    com.zwinsight: DEBUG
    org.testcontainers: INFO
