# 集成测试共享配置（随 zw-common test-jar 分发给各业务模块）
# 直连服务器联调库；服务器 MySQL/Redis 容器未映射宿主机端口时，
# 可通过环境变量/系统属性指向 SSH 隧道（仍为真实库，非 mock）：
#   IT_DB_URL / IT_DB_USER / IT_DB_PASS / IT_REDIS_HOST / IT_REDIS_PORT
spring:
  datasource:
    url: ${IT_DB_URL:jdbc:mysql://129.204.3.200:3306/zw_insight?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8mb4}
    username: ${IT_DB_USER:root}
    password: ${IT_DB_PASS:zwinsight123}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${IT_REDIS_HOST:129.204.3.200}
      port: ${IT_REDIS_PORT:6379}
      password: ''
      database: 0
  # 集成测试不执行迁移
  flyway:
    enabled: false

# 日志
logging:
  level:
    com.zwinsight: INFO
