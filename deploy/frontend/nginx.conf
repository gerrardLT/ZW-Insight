server {
    listen 80;
    server_name _;

    # ── Gzip 压缩 ──────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/xml
        application/xml
        text/javascript
        image/svg+xml;

    # ── SPA 入口：禁止缓存 index.html ───────────────────────
    # Vite 资产文件名带内容 hash，可长期 immutable；但 index.html 是当前版本的资产清单，
    # 一旦被浏览器/代理缓存，旧 SPA 会持续运行旧 JS，表现为“部署成功但菜单/字段/标签一个没变”。
    # exact location 优先于下方静态资源正则，普通刷新即可拿到最新入口。
    location = /index.html {
        root /usr/share/nginx/html;
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    # ── 前端 SPA 路由 ─────────────────────────────────────
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;

        # history 路由 fallback 到 index.html 时同样不得缓存入口。
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    }

    # ── 根路径单独禁缓存（避免 / 入口被中间代理缓存旧 index） ──
    location = / {
        root /usr/share/nginx/html;
        try_files /index.html =404;
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
    }

    # ── API 反向代理（前端 baseURL=/api → 后端 :8080）──────
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 文件上传大小限制
        client_max_body_size 50m;

        # WebSocket 支持（Flowable 流程推送等场景）
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # 超时设置
        proxy_connect_timeout 60s;
        proxy_read_timeout 120s;
        proxy_send_timeout 60s;
    }

    # ── 可变品牌图片：独立共享卷，更新后不使用 immutable 缓存 ──
    location ^~ /brand/ {
        # 上传文件存于 backend/frontend 共享 volume，独立于只读 dist 挂载。
        alias /var/www/brand/;
        expires 5m;
        add_header Cache-Control "public, max-age=300";
    }

    # ── 静态资源长缓存（Vite 产物带 hash，可安全强缓存）───
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff|woff2|ttf|eot)$ {
        root /usr/share/nginx/html;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
